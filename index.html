function createWall(

    z,

    width,

    depth,

    height = 4

) {

        new THREE.MeshBasicMaterial({

            color: 0x777777

        });


    let wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    scene.add(wall);


    walls.push(wall);


    return wall;

}

// =====================================================
// WAVE SYSTEM
// =====================================================

function startWave() {


    if (gameOver)
        return;


    if (waveStarting)
        return;


    waveStarting = true;


    currentWave++;


    waveInProgress = true;


    // Wave 1 = 5
    // Wave 2 = 7
    // Wave 3 = 9

    waveEnemiesRemaining =

        5 +

        (

            currentWave - 1

        ) * 2;


    waveSpawnTimer = 0;


    updateWaveHUD();


    console.log(

        "STARTING WAVE:",

        currentWave,

        "ENEMIES:",

        waveEnemiesRemaining

    );


    setTimeout(

        function() {

            waveStarting = false;

        },

        500

    );

}


// =====================================================
// WAVE UPDATE
// =====================================================

function updateWaveSystem(

    delta

) {


    if (gameOver)
        return;


    if (!waveInProgress)
        return;


    let activeEnemies =

        enemies.filter(

            enemy => enemy.alive

        ).length;


    // Spawn gradually

    if (

        waveEnemiesRemaining > 0 &&

        activeEnemies <

        MAX_ACTIVE_ENEMIES

    ) {


        waveSpawnTimer -= delta;


        if (

            waveSpawnTimer <= 0

        ) {


            spawnWaveEnemy();


            waveEnemiesRemaining--;


            waveSpawnTimer =

                0.7;

        }

    }


    let aliveEnemies =

        enemies.filter(

            enemy => enemy.alive

        ).length;


    // Wave complete

    if (

        waveEnemiesRemaining <= 0 &&

        aliveEnemies === 0

    ) {


        waveInProgress = false;


        console.log(

            "WAVE COMPLETE:",

            currentWave

        );


        // Next wave in 3 seconds

        setTimeout(

            function() {


                if (!gameOver) {

                    startWave();

                }


            },

            3000

        );

    }

}


// =====================================================
// SPAWN WAVE ENEMY
// =====================================================

function spawnWaveEnemy() {


    if (gameOver)
        return;


    let attempts = 0;


    let spawn;


    let x;

    let z;


    // Find a safe spawn

    do {


        spawn =

            spawnPoints[

                Math.floor(

                    Math.random() *

                    spawnPoints.length

                )

            ];


        x = spawn[0];

        z = spawn[1];


        let distance =

            Math.sqrt(

                Math.pow(

                    x -

                    player.position.x,

                    2

                )

                +

                Math.pow(

                    z -

                    player.position.z,

                    2

                )

            );


        attempts++;


        if (

            distance >= 40

        ) {

            break;

        }


    }

    while (

        attempts < 30

    );


    createEnemy(

        x,

        z

    );

}


// =====================================================
// CREATE ROBOT ENEMY

function createEnemy(

    let bodyGeometry =

    body.position.y =

    // =========================

        });


    let head =

    // =========================
    // EYES
    // =========================

    let eyeGeometry =

        });

    );

        );


    rightEye.position.set(

    // =========================

// =====================================================
// CONTROLS
// =====================================================

function setupControls() {


    let joystick =

        document.getElementById(

            "joystick"

        );


    let stick =

        document.getElementById(

            "stick"

        );


    // =========================
    // JOYSTICK START
    // =========================

    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]
                .identifier;

        },

        {

            passive: false

        }

    );


    // =========================
    // JOYSTICK MOVE
    // =========================

    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            if (

                joystickTouch === null

            )
                return;


            let touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===

                    joystickTouch

                );


            if (!touch)
                return;


            let rect =

                joystick.getBoundingClientRect();


            let x =

                touch.clientX -

                (

                    rect.left +

                    rect.width / 2

                );


            let y =

                touch.clientY -

                (

                    rect.top +

                    rect.height / 2

                );


            let max =

                40;


            let distance =

                Math.sqrt(

                    x*x +

                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /

                    distance *

                    max;


                y =

                    y /

                    distance *

                    max;

            }


            joyX =

                x / max;


            joyY =

                y / max;


            stick.style.transform =

                "translate(" +

                x +

                "px, " +

                y +

                "px)";

        },

        {

            passive: false

        }

    );


    // =========================
    // JOYSTICK END
    // =========================

    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch =

                null;


            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0px,0px)";

        }

    );


    // =========================
    // AIM START
    // =========================

    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.clientX >

                    window.innerWidth /

                    2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    // =========================
    // AIM MOVE
    // =========================

    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.identifier ===

                    aimTouch

                ) {


                    let dx =

                        touch.clientX -

                        lastX;


                    let dy =

                        touch.clientY -

                        lastY;


                    rotationY -=

                        dx *

                        0.004;


                    rotationX -=

                        dy *

                        0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    // =========================
    // AIM END
    // =========================

    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.identifier ===

                    aimTouch

                ) {


                    aimTouch =

                        null;

                }

            }

        }

    );


    // =========================
    // FIRE
    // =========================

    document

        .getElementById("fire")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                shoot();

            },

            {

                passive: false

            }

        );


    // =========================
    // RELOAD
    // =========================

    document

        .getElementById("reload")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            {

                passive: false

            }

        );


    // =========================
    // RESTART
    // =========================

    document

        .getElementById("restart")

        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// =====================================================
// PLAYER MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    let speed =

        8;


    let forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    let right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        player.position.add(

            movement.multiplyScalar(

                speed *

                delta

            )

        );

    }


    // 250x250 map boundaries

    player.position.x =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.z

            )

        );

}


// =====================================================
// PLAYER SHOOTING
// =====================================================

function shoot() {


    if (gameOver)
        return;


    let now =

        performance.now();


    // Fire rate

    if (

        now -

        lastPlayerShot <

        playerFireRate

    )
        return;


    lastPlayerShot =

        now;


    if (

        ammo <= 0

    ) {


        reload();


        return;

    }


    ammo--;


    updateHUD();


    // Ray from center crosshair

    let raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    let aliveEnemies =

        enemies.filter(

            e => e.alive

        );


    // Recursive true allows hitting
    // robot body parts

    let hits =

        raycaster.intersectObjects(

            aliveEnemies,

            true

        );


    if (

        hits.length > 0

    ) {


        let hitObject =

            hits[0].object;


        let enemy =

            hitObject;


        // Find parent robot group

        while (

            enemy.parent &&

            !enemy.health

        ) {


            enemy =

                enemy.parent;

        }


        if (

            enemy.alive

        ) {


            enemy.health -=

                25;


            showHitMarker();


            if (

                enemy.health <= 0

            ) {


                killEnemy(

                    enemy

                );

            }

        }

    }

}


// =====================================================
// HIT MARKER
// =====================================================

function showHitMarker() {


    let marker =

        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity =

        1;


    setTimeout(

        function() {


            marker.style.opacity =

                0;


        },

        100

    );

}


// =====================================================
// RELOAD
// =====================================================

function reload() {


    let needed =

        30 -

        ammo;


    if (

        needed <= 0 ||

        reserve <= 0

    )
        return;


    let amount =

        Math.min(

            needed,

            reserve

        );


    ammo +=

        amount;


    reserve -=

        amount;


    updateHUD();

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(

    delta

) {


    if (gameOver)
        return;


    for (

        let enemy of

        enemies

    ) {


        if (!enemy.alive)
            continue;


        // Direction to player

        let direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y = 0;


        let distance =

            direction.length();


        // =========================
        // DETECTION
        // =========================

        if (

            distance >

            enemy.detectionRange

        ) {


            continue;

        }


        // =========================
        // FACE PLAYER
        // =========================

        enemy.lookAt(

            player.position.x,

            enemy.position.y,

            player.position.z

        );


        // =========================
        // MOVE
        // =========================

        if (

            distance >

            18

        ) {


            direction.normalize();


            enemy.position.add(

                direction.multiplyScalar(

                    enemy.moveSpeed *

                    delta

                )

            );


            // Walking animation

            enemy.walkTime +=

                delta *

                8;


            enemy.leftLeg.rotation.x =

                Math.sin(

                    enemy.walkTime

                ) *

                0.5;


            enemy.rightLeg.rotation.x =

                Math.sin(

                    enemy.walkTime +

                    Math.PI

                ) *

                0.5;

        }


        // =========================
        // SHOOTING
        // =========================

        enemy.shootTimer -=

            delta;


        if (

            distance <

            enemy.attackRange &&

            enemy.shootTimer <= 0

        ) {


            enemy.shootTimer =

                1.5 +

                Math.random() *

                1.5;


            enemyShoot(

                enemy

            );

        }

    }

}


// =====================================================
// ENEMY SHOOTING
// =====================================================

function enemyShoot(

    enemy

) {


    if (gameOver)
        return;


    // Enemy weapon position

    let start =

        enemy.position.clone();


    start.y +=

        2;


    // Target player chest

    let target =

        player.position.clone();


    target.y -=

        0.3;


    let direction =

        new THREE.Vector3();


    direction.subVectors(

        target,

        start

    );


    direction.normalize();


    // Small aiming error

    direction.x +=

        (

            Math.random() -

            0.5

        ) *

        0.035;


    direction.y +=

        (

            Math.random() -

            0.5

        ) *

        0.035;


    direction.z +=

        (

            Math.random() -

            0.5

        ) *

        0.035;


    direction.normalize();


    let raycaster =

        new THREE.Raycaster(

            start,

            direction

        );


    raycaster.far =

        70;


    let hits =

        raycaster.intersectObject(

            player,

            true

        );


    if (

        hits.length > 0

    ) {


        // Reduced damage so player
        // isn't killed immediately

        takeDamage(

            5

        );

    }

}


// =====================================================
// DAMAGE
// =====================================================

function takeDamage(

    damage

) {


    if (gameOver)
        return;


    health -=

        damage;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    let flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity =

        1;


    setTimeout(

        function() {


            flash.style.opacity =

                0;


        },

        120

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}


// =====================================================
// HUD
// =====================================================

function updateHUD() {


    document.getElementById(

        "ammo"

    ).textContent =

        ammo;


    document.getElementById(

        "reserve"

    ).textContent =

        reserve;


    document.getElementById(

        "kills"

    ).textContent =

        kills;


    document.getElementById(

        "enemyCount"

    ).textContent =

        enemies.filter(

            e => e.alive

        ).length;


    document.getElementById(

        "health"

    ).style.width =

        health +

        "%";

}


// =====================================================
// WAVE HUD
// =====================================================

function updateWaveHUD() {


    document.getElementById(

        "wave"

    ).textContent =

        currentWave;

}


// =====================================================
// WIN / LOSE
// =====================================================

function winGame() {


    // Endless waves mean there
    // is no normal win state

    return;

}


function loseGame() {


    if (gameOver)
        return;


    gameOver = true;


    document.getElementById(

        "messageText"

    ).textContent =

        "GAME OVER";


    document.getElementById(

        "message"

    ).style.display =

        "block";

}


// =====================================================
// RESIZE
// =====================================================

function resize() {


    camera.aspect =

        window.innerWidth /

        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    let now =

        performance.now();


    let delta =

        (

            now -

            lastTime

        ) / 1000;


    lastTime =

        now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    updateWaveSystem(

        delta

    );


    updateHUD();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();


</script>
