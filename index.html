<script type="module">


import * as THREE from

"https://cdn.jsdelivr.net/npm/three@0.177.0/build/three.module.js";


// =====================================================
// GAME VARIABLES
// =====================================================

let scene;

let camera;

let renderer;

let player;

let gun;

let muzzleFlash;

let enemies = [];

let particles = [];

let health = 100;

let ammo = 30;

let reserveAmmo = 120;

let kills = 0;

let gameOver = false;

let reloading = false;

const maxAmmo = 30;


// Movement

let joystickX = 0;

let joystickY = 0;


// Camera

let yaw = 0;

let pitch = 0;


// Touch aiming

let aimTouch = null;

let lastAimX = 0;

let lastAimY = 0;


// Shooting

let lastShotTime = 0;

const fireRate = 150;


// =====================================================
// INIT
// =====================================================

function init() {


    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x87CEEB
        );


    camera =
        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =
        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setPixelRatio(

        Math.min(

            window.devicePixelRatio,

            2

        )

    );


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document
        .getElementById("game")
        .appendChild(

            renderer.domElement

        );


    setupLighting();


    player =
        new THREE.Object3D();


    player.position.set(

        0,

        1.7,

        10

    );


    scene.add(

        player

    );


    player.add(

        camera

    );


    createWorld();


    createGun();


    spawnEnemies();


    setupJoystick();


    setupAiming();


    setupButtons();


    window.addEventListener(

        "resize",

        resize

    );


    animate();


    updateHUD();

}


// =====================================================
// LIGHTING
// =====================================================

function setupLighting() {


    const ambient =

        new THREE.AmbientLight(

            0xffffff,

            1.4

        );


    scene.add(

        ambient

    );


    const sunlight =

        new THREE.DirectionalLight(

            0xffffff,

            2

        );


    sunlight.position.set(

        20,

        30,

        10

    );


    scene.add(

        sunlight

    );

}


// =====================================================
// WORLD
// =====================================================

function createWorld() {


    const groundGeometry =

        new THREE.PlaneGeometry(

            100,

            100

        );


    const groundMaterial =

        new THREE.MeshStandardMaterial({

            color: 0x3a8f3a

        });


    const ground =

        new THREE.Mesh(

            groundGeometry,

            groundMaterial

        );


    ground.rotation.x =

        -Math.PI / 2;


    scene.add(

        ground

    );


    // Outer walls

    createWall(

        0,

        -25,

        50,

        1,

        5

    );


    createWall(

        0,

        25,

        50,

        1,

        5

    );


    createWall(

        -25,

        0,

        1,

        50,

        5

    );


    createWall(

        25,

        0,

        1,

        50,

        5

    );


    // Cover

    createWall(

        -8,

        0,

        3,

        12,

        2

    );


    createWall(

        8,

        -5,

        3,

        12,

        2

    );


    createWall(

        0,

        -10,

        12,

        3,

        2

    );


    createWall(

        -12,

        -12,

        5,

        5,

        2

    );


    createWall(

        12,

        8,

        5,

        5,

        2

    );

}


// =====================================================
// WALL
// =====================================================

function createWall(

    x,

    z,

    width,

    depth,

    height

) {


    const geometry =

        new THREE.BoxGeometry(

            width,

            height,

            depth

        );


    const material =

        new THREE.MeshStandardMaterial({

            color: 0x777777

        });


    const wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    scene.add(

        wall

    );

}


// =====================================================
// GUN
// =====================================================

function createGun() {


    gun =

        new THREE.Group();


    gun.position.set(

        0.35,

        -0.3,

        -0.7

    );


    camera.add(

        gun

    );


    // Main weapon

    const bodyGeometry =

        new THREE.BoxGeometry(

            0.25,

            0.25,

            0.8

        );


    const bodyMaterial =

        new THREE.MeshStandardMaterial({

            color: 0x222222

        });


    const body =

        new THREE.Mesh(

            bodyGeometry,

            bodyMaterial

        );


    gun.add(

        body

    );


    // Barrel

    const barrelGeometry =

        new THREE.CylinderGeometry(

            0.05,

            0.05,

            0.6,

            12

        );


    const barrel =

        new THREE.Mesh(

            barrelGeometry,

            bodyMaterial

        );


    barrel.rotation.x =

        Math.PI / 2;


    barrel.position.z =

        -0.6;


    gun.add(

        barrel

    );


    // Muzzle flash

    const flashGeometry =

        new THREE.SphereGeometry(

            0.15,

            8,

            8

        );


    const flashMaterial =

        new THREE.MeshBasicMaterial({

            color: 0xffff00

        });


    muzzleFlash =

        new THREE.Mesh(

            flashGeometry,

            flashMaterial

        );


    muzzleFlash.position.z =

        -0.9;


    muzzleFlash.visible =

        false;


    gun.add(

        muzzleFlash

    );

}


// =====================================================
// SPAWN ENEMIES
// =====================================================

function spawnEnemies() {


    const positions = [

        [-10, -10],

        [10, -12],

        [-12, 8],

        [12, 12],

        [0, -18],

        [-18, 0],

        [18, -5]

    ];


    for (

        let i = 0;

        i < positions.length;

        i++

    ) {


        createEnemy(

            positions[i][0],

            positions[i][1]

        );

    }

}


// =====================================================
// CREATE ENEMY
// =====================================================

function createEnemy(

    x,

    z

) {


    const enemy = {

        health: 100,

        alive: true,

        speed:
            1.2 +
            Math.random() *
            0.8,

        attackCooldown: 0,

        mesh: null

    };


    const geometry =

        new THREE.BoxGeometry(

            1.4,

            2,

            1.4

        );


    const material =

        new THREE.MeshStandardMaterial({

            color: 0xff2222

        });


    const mesh =

        new THREE.Mesh(

            geometry,

            material

        );


    mesh.position.set(

        x,

        1,

        z

    );


    scene.add(

        mesh

    );


    enemy.mesh =

        mesh;


    enemies.push(

        enemy

    );

}


// =====================================================
// JOYSTICK
// =====================================================

function setupJoystick() {


    const joystick =

        document.getElementById(

            "joystick"

        );


    const knob =

        document.getElementById(

            "joystickKnob"

        );


    joystick.addEventListener(

        "touchmove",

        function(event) {


            event.preventDefault();


            const touch =

                event.touches[0];


            const rect =

                joystick
                .getBoundingClientRect();


            const centerX =

                rect.left +
                rect.width / 2;


            const centerY =

                rect.top +
                rect.height / 2;


            let x =

                touch.clientX -
                centerX;


            let y =

                touch.clientY -
                centerY;


            const distance =

                Math.sqrt(

                    x * x +
                    y * y

                );


            const maxDistance =

                40;


            if (

                distance >
                maxDistance

            ) {


                x =

                    x /
                    distance *
                    maxDistance;


                y =

                    y /
                    distance *
                    maxDistance;

            }


            joystickX =

                x /
                maxDistance;


            joystickY =

                y /
                maxDistance;


            knob.style.transform =

                `translate(${x}px, ${y}px)`;

        },

        {

            passive: false

        }

    );


    joystick.addEventListener(

        "touchend",

        function() {


            joystickX = 0;

            joystickY = 0;


            knob.style.transform =

                "translate(0px, 0px)";

        }

    );

}


// =====================================================
// TOUCH AIMING
// =====================================================

function setupAiming() {


    renderer.domElement.addEventListener(

        "touchstart",

        function(event) {


            for (

                const touch
                of event.changedTouches

            ) {


                if (

                    touch.clientX >
                    window.innerWidth / 2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(event) {


            for (

                const touch
                of event.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    const deltaX =

                        touch.clientX -
                        lastAimX;


                    const deltaY =

                        touch.clientY -
                        lastAimY;


                    yaw -=

                        deltaX *
                        0.004;


                    pitch -=

                        deltaY *
                        0.004;


                    pitch =

                        Math.max(

                            -1.4,

                            Math.min(

                                1.4,

                                pitch

                            )

                        );


                    player.rotation.y =

                        yaw;


                    camera.rotation.x =

                        pitch;


                    lastAimX =

                        touch.clientX;


                    lastAimY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(event) {


            for (

                const touch
                of event.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    aimTouch =

                        null;

                }

            }

        }

    );

}


// =====================================================
// BUTTONS
// =====================================================

function setupButtons() {


    document
        .getElementById(
            "shootButton"
        )
        .addEventListener(

            "touchstart",

            function(event) {


                event.preventDefault();


                shoot();

            },

            {

                passive: false

            }

        );


    document
        .getElementById(
            "reloadButton"
        )
        .addEventListener(

            "touchstart",

            function(event) {


                event.preventDefault();


                reload();

            },

            {

                passive: false

            }

        );


    document
        .getElementById(
            "restartButton"
        )
        .addEventListener(

            "click",

            restart

        );

}


// =====================================================
// SHOOT
// =====================================================

function shoot() {


    if (

        gameOver ||
        reloading

    )
        return;


    const now =

        performance.now();


    if (

        now -
        lastShotTime <
        fireRate

    )
        return;


    lastShotTime =

        now;


    if (

        ammo <= 0

    ) {


        reload();


        return;

    }


    ammo--;


    updateHUD();


    // Muzzle flash

    muzzleFlash.visible =

        true;


    setTimeout(

        function() {


            muzzleFlash.visible =

                false;


        },

        60

    );


    // Raycast

    const raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    const enemyMeshes =

        enemies

        .filter(

            e =>
                e.alive

        )

        .map(

            e =>
                e.mesh

        );


    const hits =

        raycaster.intersectObjects(

            enemyMeshes

        );


    if (

        hits.length > 0

    ) {


        const hitMesh =

            hits[0].object;


        const target =

            enemies.find(

                e =>
                    e.mesh ===
                    hitMesh

            );


        if (target) {


            damageEnemy(

                target,

                25

            );


            showHitMarker();

        }

    }

}


// =====================================================
// DAMAGE ENEMY
// =====================================================

function damageEnemy(

    enemy,

    damage

) {


    if (

        !enemy.alive

    )
        return;


    enemy.health -=

        damage;


    enemy.mesh.material.color.set(

        0xffffff

    );


    setTimeout(

        function() {


            if (

                enemy.alive

            ) {


                enemy.mesh.material.color.set(

                    0xff2222

                );

            }

        },

        100

    );


    if (

        enemy.health <= 0

    ) {


        enemy.alive =

            false;


        createExplosion(

            enemy.mesh.position

        );


        scene.remove(

            enemy.mesh

        );


        kills++;


        updateHUD();


        if (

            enemies.every(

                e =>
                    !e.alive

            )

        ) {


            winGame();

        }

    }

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(

    delta

) {


    if (

        gameOver

    )
        return;


    for (

        const enemy
        of enemies

    ) {


        if (

            !enemy.alive

        )
            continue;


        const direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.mesh.position

        );


        direction.y =

            0;


        const distance =

            direction.length();


        if (

            distance >
            3

        ) {


            direction.normalize();


            enemy.mesh.position.add(

                direction.multiplyScalar(

                    enemy.speed *
                    delta

                )

            );

        }


        else {


            enemy.attackCooldown -=

                delta;


            if (

                enemy.attackCooldown <=
                0

            ) {


                enemy.attackCooldown =

                    1;


                takeDamage(

                    10

                );

            }

        }


        // Face player

        enemy.mesh.lookAt(

            player.position.x,

            enemy.mesh.position.y,

            player.position.z

        );

    }

}


// =====================================================
// PLAYER DAMAGE
// =====================================================

function takeDamage(

    damage

) {


    if (

        gameOver

    )
        return;


    health -=

        damage;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    const flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity =

        "1";


    setTimeout(

        function() {


            flash.style.opacity =

                "0";


        },

        150

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}


// =====================================================
// RELOAD
// =====================================================

function reload() {


    if (

        reloading ||
        ammo === maxAmmo ||
        reserveAmmo <= 0

    )
        return;


    reloading =

        true;


    document
        .getElementById(
            "reloadButton"
        )
        .innerText =

        "RELOADING";


    setTimeout(

        function() {


            const needed =

                maxAmmo -
                ammo;


            const amount =

                Math.min(

                    needed,

                    reserveAmmo

                );


            ammo +=

                amount;


            reserveAmmo -=

                amount;


            reloading =

                false;


            document
                .getElementById(
                    "reloadButton"
                )
                .innerText =

                "RELOAD";


            updateHUD();


        },

        1000

    );

}


// =====================================================
// PARTICLE EXPLOSION
// =====================================================

function createExplosion(

    position

) {


    for (

        let i = 0;

        i < 15;

        i++

    ) {


        const geometry =

            new THREE.SphereGeometry(

                0.08,

                6,

                6

            );


        const material =

            new THREE.MeshBasicMaterial({

                color: 0xffaa00

            });


        const particle =

            new THREE.Mesh(

                geometry,

                material

            );


        particle.position.copy(

            position

        );


        particle.velocity =

            new THREE.Vector3(

                (Math.random() - 0.5) * 5,

                Math.random() * 5,

                (Math.random() - 0.5) * 5

            );


        scene.add(

            particle

        );


        particles.push(

            particle

        );

    }

}


// =====================================================
// UPDATE PARTICLES
// =====================================================

function updateParticles(

    delta

) {


    for (

        let i =
        particles.length - 1;

        i >= 0;

        i--

    ) {


        const particle =

            particles[i];


        particle.position.add(

            particle.velocity
            .clone()
            .multiplyScalar(

                delta

            )

        );


        particle.velocity.y -=

            5 *
            delta;


        particle.scale.multiplyScalar(

            0.95

        );


        if (

            particle.scale.x <
            0.02

        ) {


            scene.remove(

                particle

            );


            particles.splice(

                i,

                1

            );

        }

    }

}


// =====================================================
// HIT MARKER
// =====================================================

function showHitMarker() {


    const marker =

        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity =

        "1";


    setTimeout(

        function() {


            marker.style.opacity =

                "0";


        },

        100

    );

}


// =====================================================
// PLAYER MOVEMENT
// =====================================================

function updatePlayer(

    delta

) {


    if (

        gameOver

    )
        return;


    const speed =

        5;


    const forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    const right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    const movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joystickY

        )

    );


    movement.add(

        right.multiplyScalar(

            joystickX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        player.position.add(

            movement.multiplyScalar(

                speed *
                delta

            )

        );


    }


    // Map boundaries

    player.position.x =

        Math.max(

            -23,

            Math.min(

                23,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -23,

            Math.min(

                23,

                player.position.z

            )

        );

}

function resize() {


    camera.aspect =

        window.innerWidth /

    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    const currentTime =

        performance.now();


    const delta =

        Math.min(

            (
                currentTime -
                lastTime
            ) / 1000,

            0.1

        );


    lastTime =

        currentTime;


    updatePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    updateParticles(

        delta

    );


    renderer.render(

        scene,

        camera

    );

}
