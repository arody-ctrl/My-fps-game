function createGunModel() {

    if (gunModel) {
        camera.remove(gunModel);

    gunModel.position.set(

    else if (currentWeapon === "SNIPER") {

    }
}

function gunMaterial(color) {

    });

}

/* =====================================================
   GUN ANIMATION
===================================================== */

function updateGun(delta) {

    if (!gunModel)
        return;

    gunRecoil = THREE.MathUtils.lerp(
        gunRecoil,
        0,
        delta * 12
    );

    let targetX = isADS ? 0 : 0.45;
    let targetY = isADS ? -0.28 : -0.38;
    let targetZ = isADS ? -0.9 : -0.75;

    if (currentWeapon === "PISTOL") {
        targetX = isADS ? 0 : 0.38;
    }

    if (currentWeapon === "SNIPER") {
        targetX = isADS ? 0 : 0.42;
    }

    gunModel.position.x = THREE.MathUtils.lerp(
        gunModel.position.x,
        targetX,
        delta * 10
    );

    gunModel.position.y = THREE.MathUtils.lerp(
        gunModel.position.y,
        targetY,
        delta * 10
    );

    gunModel.position.z = THREE.MathUtils.lerp(
        gunModel.position.z,
        targetZ + gunRecoil,
        delta * 15
    );

    if (
        Math.abs(joyX) > 0.1 ||
        Math.abs(joyY) > 0.1
    ) {

        gunBobTime += delta * 8;

        gunModel.position.y +=
            Math.sin(gunBobTime) * 0.015;

        gunModel.position.x +=
            Math.cos(gunBobTime * 0.5) * 0.01;
    }

}

function fireGunAnimation() {
    gunRecoil = 0.12;

/* =====================================================

function startGame() {

    scene = new THREE.Scene();

    scene.background =
        new THREE.Color(0x87CEEB);

    camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,

    );

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(
        Math.min(window.devicePixelRatio, 1.5)
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding =
        THREE.sRGBEncoding;

    document.body.appendChild(
        renderer.domElement
    );

    let light =
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,

        );

    scene.add(light);

    player.position.set(

    );

    scene.add(player);

    player.add(camera);

    createGunModel();

    createGround();

    createMap();

    setupControls();

    updateWeaponHUD();

    updateHUD();

    window.addEventListener(
        "resize",
        resize
    );

    setTimeout(
        function() {
            startWave();
        },

    );

    animate();

}

/* =====================================================
   GROUND
===================================================== */

function createGround() {

    let geometry =
        new THREE.PlaneGeometry(
            MAP_SIZE,
            MAP_SIZE
        );

    let material =
        new THREE.MeshBasicMaterial({
            color: 0x228B22
        });

    let ground =
        new THREE.Mesh(
            geometry,
            material
        );

    ground.rotation.x =
        -Math.PI / 2;

    scene.add(ground);

}

/* =====================================================
   WALL
===================================================== */

function createWall(
    x,
    z,
    width,
    depth,
    height = 4
) {

    let geometry =
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    let material =
        new THREE.MeshStandardMaterial({
            color: 0x777777,
            roughness: 0.8
        });

    let wall =
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        height / 2,
        z
    );

    wall.userData.halfWidth =
        width / 2;

    wall.userData.halfDepth =
        depth / 2;

    scene.add(wall);

    walls.push(wall);

    return wall;

}

/* =====================================================
   MAP
===================================================== */

function createMap() {

    createWall(0, -125, 250, 2);
    createWall(0, 125, 250, 2);
    createWall(-125, 0, 2, 250);
    createWall(125, 0, 2, 250);

    createWall(-40, 0, 8, 30);
    createWall(40, -20, 8, 30);
    createWall(0, -50, 35, 8);

    createWall(-60, -60, 15, 15);
    createWall(60, 50, 15, 15);

    createWall(-70, 60, 25, 6);
    createWall(70, -60, 25, 6);

}

/* =====================================================
   COLLISION
===================================================== */

function circleIntersectsWall(
    x,
    z,
    radius
) {

    for (let wall of walls) {

        let halfWidth =
            wall.userData.halfWidth;

        let halfDepth =
            wall.userData.halfDepth;

        let closestX =
            Math.max(
                wall.position.x - halfWidth,
                Math.min(
                    x,
                    wall.position.x + halfWidth
                )
            );

        let closestZ =
            Math.max(
                wall.position.z - halfDepth,
                Math.min(
                    z,
                    wall.position.z + halfDepth
                )
            );

        let dx =
            x - closestX;

        let dz =
            z - closestZ;

        if (
            dx * dx +
            dz * dz <
            radius * radius
        ) {

            return true;

        }

    }

    return false;

}

function moveWithCollision(
    object,
    movement,
    radius
) {

    let newX =
        object.position.x +
        movement.x;

    let newZ =
        object.position.z;

    if (
        !circleIntersectsWall(
            newX,
            newZ,
            radius
        )
    ) {

        object.position.x =
            newX;

    }

    newX =
        object.position.x;

    newZ =
        object.position.z +
        movement.z;

    if (
        !circleIntersectsWall(
            newX,
            newZ,
            radius
        )
    ) {

        object.position.z =
            newZ;

    }

}

/* =====================================================
   WAVES
===================================================== */

function startWave() {

    if (gameOver)
        return;

    if (waveStarting)
        return;

    waveStarting = true;

    currentWave++;

    waveInProgress = true;

    waveEnemiesRemaining =
        5 +
        (currentWave - 1) * 2;

    waveSpawnTimer = 0;

    updateWaveHUD();

    setTimeout(
        function() {
            waveStarting = false;
        },
        500
    );

}

function updateWaveSystem(delta) {

    if (gameOver)
        return;

    if (!waveInProgress)
        return;

    let activeEnemies =
        enemies.filter(
            enemy => enemy.alive
        ).length;

    if (
        waveEnemiesRemaining > 0 &&
        activeEnemies < MAX_ACTIVE_ENEMIES
    ) {

        waveSpawnTimer -= delta;

        if (waveSpawnTimer <= 0) {

            spawnWaveEnemy();

            waveEnemiesRemaining--;

            waveSpawnTimer = 0.7;

        }

    }

    let aliveEnemies =
        enemies.filter(
            enemy => enemy.alive
        ).length;

    if (
        waveEnemiesRemaining <= 0 &&
        aliveEnemies === 0
    ) {

        waveInProgress = false;

        /* WAVE SCORE BONUS */

        let waveBonus =
            currentWave * 250;

        score += waveBonus;

        showScorePopup(
            "+" +
            waveBonus +
            " WAVE BONUS"
        );

        updateHUD();

        setTimeout(
            function() {

                if (!gameOver)
                    startWave();

            },
            3000
        );

    }

}

function spawnWaveEnemy() {

    if (gameOver)
        return;

    let attempts = 0;

    let x = 0;
    let z = 0;

    while (attempts < 30) {

        let spawn =
            spawnPoints[
                Math.floor(
                    Math.random() *
                    spawnPoints.length
                )
            ];

        x = spawn[0];
        z = spawn[1];

        let distance =
            Math.hypot(
                x - player.position.x,
                z - player.position.z
            );

        if (
            distance >= 40 &&
            !circleIntersectsWall(
                x,
                z,
                ENEMY_RADIUS
            )
        ) {

            break;

        }

        attempts++;

    }

    createEnemy(x, z);

}

/* =====================================================
   ENEMY
===================================================== */

function createEnemy(x, z) {

    let enemy =
        new THREE.Group();

    let bodyMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xff3333,
            metalness: 0.5,
            roughness: 0.5
        });

    let body =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                2,
                2.2,
                1.5
            ),
            bodyMaterial
        );

    body.position.y = 2.2;

    enemy.add(body);

    let head =
        new THREE.Mesh(
            new THREE.BoxGeometry(
                1.5,
                1.2,
                1.5
            ),
            new THREE.MeshStandardMaterial({
                color: 0x555555,
                metalness: 0.8,
                roughness: 0.3
            })
        );

    head.position.y = 4;

    enemy.add(head);

    let eyeMaterial =
        new THREE.MeshBasicMaterial({
            color: 0xffff00
        });

    let eyeGeometry =
        new THREE.BoxGeometry(
            0.25,
            0.25,
            0.1
        );

    let leftEye =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    leftEye.position.set(
        -0.4,
        4,
        -0.78
    );

    let rightEye =
        new THREE.Mesh(
            eyeGeometry,
            eyeMaterial
        );

    rightEye.position.set(
        0.4,
        4,
        -0.78
    );

    enemy.add(leftEye);
    enemy.add(rightEye);

    let legGeometry =
        new THREE.BoxGeometry(
            0.55,
            1.7,
            0.55
        );

    let leftLeg =
        new THREE.Mesh(
            legGeometry,
            bodyMaterial
        );

    let rightLeg =
        new THREE.Mesh(
            legGeometry,
            bodyMaterial
        );

    leftLeg.position.set(
        -0.5,
        0.8,
        0
    );

    rightLeg.position.set(
        0.5,
        0.8,
        0
    );

    enemy.add(leftLeg);
    enemy.add(rightLeg);

    let armGeometry =
        new THREE.BoxGeometry(
            0.5,
            1.8,
            0.5
        );

    let leftArm =
        new THREE.Mesh(
            armGeometry,
            bodyMaterial
        );

    let rightArm =
        new THREE.Mesh(
            armGeometry,
            bodyMaterial
        );

    leftArm.position.set(
        -1.3,
        2.2,
        0
    );

    rightArm.position.set(
        1.3,
        2.2,
        0
    );

    enemy.add(leftArm);
    enemy.add(rightArm);

    enemy.position.set(
        x,
        0,
        z
    );

    enemy.health = 100;
    enemy.maxHealth = 100;
    enemy.alive = true;

    enemy.detectionRange = 150;
    enemy.attackRange = 60;

    enemy.moveSpeed =
        1.2 +
        Math.random() * 0.5;

    enemy.shootTimer =
        1 +
        Math.random() * 2;

    enemy.walkTime =
        Math.random() * 10;

    enemy.leftLeg = leftLeg;
    enemy.rightLeg = rightLeg;

    scene.add(enemy);

    enemies.push(enemy);

    return enemy;

}

/* =====================================================
   KILL + SCORE
===================================================== */

function killEnemy(enemy) {

    if (!enemy.alive)
        return;

    enemy.alive = false;

    scene.remove(enemy);

    kills++;

    let points = 100;

    /* SNIPER BONUS */

    if (currentWeapon === "SNIPER") {

        points = 250;

    }

    /* LONG RANGE BONUS */

    let distance =
        player.position.distanceTo(
            enemy.position
        );

    if (distance > 75) {

        points += 100;

    }

    score += points;

    showScorePopup(
        "+" +
        points
    );

    updateHUD();

}

/* =====================================================
   SCORE POPUP
===================================================== */

let scorePopupTimer = null;

function showScorePopup(text) {

    let popup =
        document.getElementById(
            "scorePopup"
        );

    popup.textContent = text;

    popup.style.opacity = 1;

    if (scorePopupTimer) {

        clearTimeout(
            scorePopupTimer
        );

    }

    scorePopupTimer =
        setTimeout(
            function() {

                popup.style.opacity = 0;

            },
            700
        );

}

/* =====================================================
   WEAPON SWITCHING
===================================================== */

function switchWeapon(weaponName) {

    if (!weapons[weaponName])
        return;

    currentWeapon = weaponName;

    isADS = false;

    camera.fov =
        weapons[currentWeapon]
            .normalFOV;

    camera.updateProjectionMatrix();

    document.getElementById(
        "scopeOverlay"
    ).style.display = "none";

    document.getElementById(
        "crosshair"
    ).style.display = "block";

    createGunModel();

    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.weapon ===
                    currentWeapon
                );

            }
        );

    updateWeaponHUD();

}

/* =====================================================
   WEAPON HUD
===================================================== */

function updateWeaponHUD() {

    let weapon =
        weapons[currentWeapon];

    document.getElementById(
        "weaponName"
    ).textContent =
        weapon.name;

    document.getElementById(
        "ammo"
    ).textContent =
        weapon.ammo;

    document.getElementById(
        "reserve"
    ).textContent =
        weapon.reserve;

    document.getElementById(
        "adsStatus"
    ).textContent =

        isADS

        ?

        currentWeapon === "SNIPER"

            ?

            "LONG RANGE SCOPE"

            :

            "IRON SIGHTS / ADS"

        :

        "HIP FIRE";

}

/* =====================================================
   ADS
===================================================== */

function toggleADS() {

    if (gameOver)
        return;

    isADS = !isADS;

    let weapon =
        weapons[currentWeapon];

    if (isADS) {

        camera.fov =
            weapon.adsFOV;

        camera.updateProjectionMatrix();

        if (
            currentWeapon === "SNIPER"
        ) {

            document.getElementById(
                "scopeOverlay"
            ).style.display = "block";

            document.getElementById(
                "crosshair"
            ).style.display = "none";

        }

    }

    else {

        camera.fov =
            weapon.normalFOV;

        camera.updateProjectionMatrix();

        document.getElementById(
            "scopeOverlay"
        ).style.display = "none";

        document.getElementById(
            "crosshair"
        ).style.display = "block";

    }

    updateWeaponHUD();

}

/* =====================================================
   CONTROLS
===================================================== */

function setupControls() {

    let joystick =
        document.getElementById(
            "joystick"
        );

    let stick =
        document.getElementById(
            "stick"
        );

    joystick.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            if (joystickTouch !== null)
                return;

            joystickTouch =
                e.changedTouches[0]
                    .identifier;

        },
        {
            passive: false
        }
    );

    joystick.addEventListener(
        "touchmove",
        function(e) {

            e.preventDefault();

            if (joystickTouch === null)
                return;

            let touch =
                [...e.touches].find(
                    t =>
                        t.identifier ===
                        joystickTouch
                );

            if (!touch)
                return;

            let rect =
                joystick.getBoundingClientRect();

            let x =
                touch.clientX -
                (
                    rect.left +
                    rect.width / 2
                );

            let y =
                touch.clientY -
                (
                    rect.top +
                    rect.height / 2
                );

            let max = 40;

            let distance =
                Math.hypot(x, y);

            if (distance > max) {

                x =
                    x /
                    distance *
                    max;

                y =
                    y /
                    distance *
                    max;

            }

            joyX = x / max;
            joyY = y / max;

            stick.style.transform =
                "translate(" +
                x +
                "px, " +
                y +
                "px)";

        },
        {
            passive: false
        }
    );

    function resetJoystick() {

        joystickTouch = null;

        joyX = 0;
        joyY = 0;

        stick.style.transform =
            "translate(0px,0px)";

    }

    joystick.addEventListener(
        "touchend",
        resetJoystick
    );

    joystick.addEventListener(
        "touchcancel",
        resetJoystick
    );

    renderer.domElement.addEventListener(
        "touchstart",
        function(e) {

            for (
                let touch of
                e.changedTouches
            ) {

                if (
                    touch.clientX >
                    window.innerWidth / 2
                ) {

                    if (
                        aimTouch === null
                    ) {

                        aimTouch =
                            touch.identifier;

                        lastX =
                            touch.clientX;

                        lastY =
                            touch.clientY;

                    }

                }

            }

        },
        {
            passive: true
        }
    );

    renderer.domElement.addEventListener(
        "touchmove",
        function(e) {

            for (
                let touch of
                e.changedTouches
            ) {

                if (
                    touch.identifier ===
                    aimTouch
                ) {

                    let dx =
                        touch.clientX -
                        lastX;

                    let dy =
                        touch.clientY -
                        lastY;

                    rotationY -=
                        dx * 0.004;

                    rotationX -=
                        dy * 0.004;

                    rotationX =
                        Math.max(
                            -1.3,
                            Math.min(
                                1.3,
                                rotationX
                            )
                        );

                    player.rotation.y =
                        rotationY;

                    camera.rotation.x =
                        rotationX;

                    lastX =
                        touch.clientX;

                    lastY =
                        touch.clientY;

                }

            }

        },
        {
            passive: true
        }
    );

    function resetAim(e) {

        for (
            let touch of
            e.changedTouches
        ) {

            if (
                touch.identifier ===
                aimTouch
            ) {

                aimTouch = null;

            }

        }

    }

    renderer.domElement.addEventListener(
        "touchend",
        resetAim
    );

    renderer.domElement.addEventListener(
        "touchcancel",
        resetAim
    );

    /* FIRE */

    let fireButton =
        document.getElementById(
            "fire"
        );

    fireButton.addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            isFiring = true;

            shoot();

        },
        {
            passive: false
        }
    );

    fireButton.addEventListener(
        "touchend",
        function(e) {

            e.preventDefault();

            isFiring = false;

        },
        {
            passive: false
        }
    );

    fireButton.addEventListener(
        "touchcancel",
        function() {

            isFiring = false;

        }
    );

    /* ADS */

    document.getElementById(
        "ads"
    ).addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            toggleADS();

        },
        {
            passive: false
        }
    );

    /* RELOAD */

    document.getElementById(
        "reload"
    ).addEventListener(
        "touchstart",
        function(e) {

            e.preventDefault();

            reload();

        },
        {
            passive: false
        }
    );

    /* WEAPONS */

    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "touchstart",
                    function(e) {

                        e.preventDefault();

                        switchWeapon(
                            button.dataset.weapon
                        );

                    },
                    {
                        passive: false
                    }
                );

            }
        );

    /* RESTART */

    document.getElementById(
        "restart"
    ).addEventListener(
        "click",
        function() {

            location.reload();

        }
    );

}

/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer(delta) {

    if (gameOver)
        return;

    let speed = 8;

    let forward =
        new THREE.Vector3(
            0,
            0,
            -1
        );

    let right =
        new THREE.Vector3(
            1,
            0,
            0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    forward.y = 0;
    right.y = 0;

    forward.normalize();
    right.normalize();

    let movement =
        new THREE.Vector3();

    movement.add(
        forward.multiplyScalar(
            -joyY
        )
    );

    movement.add(
        right.multiplyScalar(
            joyX
        )
    );

    if (movement.length() > 0) {

        movement.normalize();

        movement.multiplyScalar(
            speed * delta
        );

        moveWithCollision(
            player,
            movement,
            PLAYER_RADIUS
        );

    }

    player.position.x =
        Math.max(
            -120,
            Math.min(
                120,
                player.position.x
            )
        );

    player.position.z =
        Math.max(
            -120,
            Math.min(
                120,
                player.position.z
            )
        );

}

/* =====================================================
   SHOOTING
===================================================== */

    /* =====================================================
   SHOOTING + PROJECTILE + HIT DETECTION REBUILD
===================================================== */

function shoot() {

    if (gameOver)
        return;

    let weapon = weapons[currentWeapon];

    let now = performance.now();

    /* FIRE RATE */
    if (
        now - lastPlayerShot <
        weapon.fireRate
    ) {
        return;
    }

    /* NO AMMO */
    if (weapon.ammo <= 0) {

        reload();

        return;

    }

    lastPlayerShot = now;

    weapon.ammo--;

    fireGunAnimation();

    updateWeaponHUD();


    /* =================================================
       1. GET EXACT CENTER OF SCREEN
    ================================================= */

    let screenCenter =
        new THREE.Vector2(
            0,
            0
        );


    /* =================================================
       2. RAYCAST FROM CAMERA THROUGH CROSSHAIR
       
       THREE.JS NDC:
       X = 0
       Y = 0

       This is the exact center of the screen.
    ================================================= */

    let raycaster =
        new THREE.Raycaster();

    raycaster.setFromCamera(
        screenCenter,
        camera
    );


    /* =================================================
       3. GET CAMERA WORLD POSITION
    ================================================= */

    let start =
        new THREE.Vector3();

    camera.getWorldPosition(
        start
    );


    /* =================================================
       4. GET AIM DIRECTION
    ================================================= */

    let direction =
        raycaster.ray.direction.clone();


    /* =================================================
       5. APPLY WEAPON SPREAD
    ================================================= */

    if (
        weapon.spread > 0
    ) {

        direction.x +=
            (
                Math.random() - 0.5
            ) *
            weapon.spread;

        direction.y +=
            (
                Math.random() - 0.5
            ) *
            weapon.spread;

        direction.z +=
            (
                Math.random() - 0.5
            ) *
            weapon.spread;

        direction.normalize();

    }


    /* =================================================
       6. CREATE VISIBLE PROJECTILE
    ================================================= */

    createProjectile(

        start,

        direction,

        true,

        weapon.damage,

        weapon.projectileSpeed,

        weapon.projectileLife

    );

}


/* =====================================================
   CREATE PROJECTILE
===================================================== */

function createProjectile(
    start,
    direction,
    friendly,
    damage,
    speed,
    life
) {

    /* =================================================
       VISIBLE BULLET
    ================================================= */

    let bulletGeometry =
        new THREE.SphereGeometry(
            friendly ? 0.12 : 0.16,
            8,
            8
        );

    let bulletMaterial =
        new THREE.MeshBasicMaterial({

            color:
                friendly
                    ? 0xffff00
                    : 0xff0000

        });

    let bullet =
        new THREE.Mesh(
            bulletGeometry,
            bulletMaterial
        );


    /* =================================================
       BULLET POSITION
    ================================================= */

    bullet.position.copy(
        start
    );


    /* =================================================
       ADD BULLET TO SCENE
    ================================================= */

    scene.add(
        bullet
    );


    /* =================================================
       PROJECTILE DATA
    ================================================= */

    bullet.userData = {

        direction:
            direction.clone().normalize(),

        speed:
            speed,

        damage:
            damage,

        friendly:
            friendly,

        life:
            life,

        age:
            0,

        previousPosition:
            start.clone()

    };


    /* =================================================
       ADD TO PROJECTILE ARRAY
    ================================================= */

    projectiles.push(
        bullet
    );

}


/* =====================================================
   UPDATE ALL PROJECTILES
===================================================== */

function updateProjectiles(delta) {

    if (
        projectiles.length === 0
    ) {
        return;
    }


    /* =================================================
       LOOP BACKWARD
       Allows safe removal
    ================================================= */

    for (
        let i =
            projectiles.length - 1;

        i >= 0;

        i--
    ) {

        let projectile =
            projectiles[i];

        if (!projectile) {

            projectiles.splice(
                i,
                1
            );

            continue;

        }


        let data =
            projectile.userData;


        /* =================================================
           SAVE OLD POSITION
        ================================================= */

        let oldPosition =
            projectile.position.clone();


        data.previousPosition =
            oldPosition.clone();


        /* =================================================
           MOVE BULLET
        ================================================= */

        let movement =
            data.direction
                .clone()
                .multiplyScalar(
                    data.speed *
                    delta
                );


        projectile.position.add(
            movement
        );


        /* =================================================
           INCREASE BULLET AGE
        ================================================= */

        data.age +=
            delta;


        /* =================================================
           REMOVE OLD BULLETS
        ================================================= */

        if (
            data.age >=
            data.life
        ) {

            removeProjectile(
                i
            );

            continue;

        }


        /* =================================================
           BULLET TRAVEL SEGMENT
           
           We check from the old position
           to the new position.

           This prevents fast bullets
           from passing through enemies.
        ================================================= */

        let travelDirection =
            projectile.position
                .clone()
                .sub(
                    oldPosition
                );

        let travelDistance =
            travelDirection.length();


        if (
            travelDistance <= 0
        ) {

            continue;

        }


        travelDirection.normalize();


        /* =================================================
           RAYCAST BULLET PATH
        ================================================= */

        let bulletRay =
            new THREE.Raycaster(
                oldPosition,
                travelDirection,
                0,
                travelDistance
            );


        /* =================================================
           CHECK WALL COLLISION
        ================================================= */

        let wallHits =
            bulletRay.intersectObjects(
                walls,
                false
            );


        /* =================================================
           IF BULLET HITS WALL
        ================================================= */

        if (
            wallHits.length > 0
        ) {

            removeProjectile(
                i
            );

            continue;

        }


        /* =================================================
           PLAYER BULLET
           CHECK ENEMIES
        ================================================= */

        if (
            data.friendly
        ) {

            let hitEnemy =
                checkBulletEnemyHit(
                    bulletRay,
                    data.damage
                );


            if (
                hitEnemy
            ) {

                removeProjectile(
                    i
                );

                continue;

            }

        }


        /* =================================================
           ENEMY BULLET
           CHECK PLAYER
        ================================================= */

        else {

            if (
                checkBulletPlayerHit(
                    bulletRay
                )
            ) {

                removeProjectile(
                    i
                );

                continue;

            }

        }

    }

}


/* =====================================================
   CHECK BULLET → ENEMY HIT
===================================================== */

function checkBulletEnemyHit(
    bulletRay,
    damage
) {

    for (
        let i = 0;

        i < enemies.length;

        i++
    ) {

        let enemy =
            enemies[i];


        /* =================================================
           IGNORE DEAD ENEMIES
        ================================================= */

        if (
            !enemy.alive
        ) {

            continue;

        }


        /* =================================================
           GET ALL ENEMY MESHES
        ================================================= */

        let enemyMeshes = [];


        enemy.traverse(
            function(object) {

                if (
                    object.isMesh
                ) {

                    enemyMeshes.push(
                        object
                    );

                }

            }
        );


        /* =================================================
           TEST BULLET RAY AGAINST ENEMY
        ================================================= */

        let hits =
            bulletRay.intersectObjects(
                enemyMeshes,
                false
            );


        /* =================================================
           ENEMY HIT
        ================================================= */

        if (
            hits.length > 0
        ) {

            let hit =
                hits[0];


            /* =============================================
               HIT MARKER
            ============================================= */

            showHitMarker();


            /* =============================================
               DAMAGE ENEMY
            ============================================= */

            enemy.health -=
                damage;


            /* =============================================
               HIT EFFECT
            ============================================= */

            createHitEffect(
                hit.point
            );


            /* =============================================
               ENEMY DEATH
            ============================================= */

            if (
                enemy.health <= 0
            ) {

                killEnemy(
                    enemy
                );

            }

            else {

                /* =========================================
                   HIT SCORE
                   Small reward for damaging enemy
                ========================================= */

                score += 10;

                showScorePopup(
                    "+10"
                );

                updateHUD();

            }


            return true;

        }

    }


    return false;

}


/* =====================================================
   CHECK BULLET → PLAYER HIT
===================================================== */

function checkBulletPlayerHit(
    bulletRay
) {

    /* =================================================
       PLAYER HITBOX
    ================================================= */

    let playerPosition =
        player.position.clone();


    /* =================================================
       SIMPLE PLAYER RADIUS
    ================================================= */

    let playerRadius =
        1.0;


    /* =================================================
       FIND CLOSEST POINT ON RAY
    ================================================= */

    let rayOrigin =
        bulletRay.ray.origin;

    let rayDirection =
        bulletRay.ray.direction;


    let toPlayer =
        playerPosition
            .clone()
            .sub(
                rayOrigin
            );


    let distanceAlongRay =
        toPlayer.dot(
            rayDirection
        );


    /* =================================================
       PLAYER BEHIND BULLET
    ================================================= */

    if (
        distanceAlongRay < 0
    ) {

        return false;

    }


    /* =================================================
       FIND CLOSEST POINT
    ================================================= */

    let closestPoint =
        rayOrigin
            .clone()
            .add(
                rayDirection
                    .clone()
                    .multiplyScalar(
                        distanceAlongRay
                    )
            );


    /* =================================================
       DISTANCE FROM PLAYER
    ================================================= */

    let distance =
        closestPoint.distanceTo(
            playerPosition
        );


    /* =================================================
       PLAYER HIT
    ================================================= */

    if (
        distance <=
        playerRadius
    ) {

        takeDamage(
            5
        );

        return true;

    }


    return false;

}


/* =====================================================
   BULLET HIT EFFECT
===================================================== */

function createHitEffect(
    position
) {

    let geometry =
        new THREE.SphereGeometry(
            0.18,
            6,
            6
        );

    let material =
        new THREE.MeshBasicMaterial({

            color:
                0xffff00,

            transparent:
                true,

            opacity:
                1

        });

    let effect =
        new THREE.Mesh(
            geometry,
            material
        );

    effect.position.copy(
        position
    );

    scene.add(
        effect
    );


    /* =================================================
       SIMPLE EFFECT ANIMATION
    ================================================= */

    let startTime =
        performance.now();


    function animateHitEffect() {

        let elapsed =
            performance.now() -
            startTime;


        let progress =
            elapsed / 150;


        if (
            progress >= 1
        ) {

            scene.remove(
                effect
            );

            return;

        }


        effect.scale.setScalar(
            1 +
            progress * 3
        );

        effect.material.opacity =
            1 -
            progress;


        requestAnimationFrame(
            animateHitEffect
        );

    }


    animateHitEffect();

}


/* =====================================================
   REMOVE PROJECTILE
===================================================== */

function removeProjectile(
    index
) {

    if (
        index < 0 ||
        index >=
        projectiles.length
    ) {

        return;

    }


    let projectile =
        projectiles[index];


    if (
        projectile
    ) {

        scene.remove(
            projectile
        );


        /* =================================================
           CLEAN UP GEOMETRY
        ================================================= */

        if (
            projectile.geometry
        ) {

            projectile.geometry.dispose();

        }


        /* =================================================
           CLEAN UP MATERIAL
        ================================================= */

        if (
            projectile.material
        ) {

            projectile.material.dispose();

        }

    }


    projectiles.splice(
        index,
        1
    );

}


/* =====================================================
   RELOAD
===================================================== */

function reload() {

    let weapon =
        weapons[currentWeapon];


    let needed =
        weapon.magazineSize -
        weapon.ammo;


    if (
        needed <= 0 ||
        weapon.reserve <= 0
    ) {

        return;

    }


    let amount =
        Math.min(
            needed,
            weapon.reserve
        );


    weapon.ammo +=
        amount;


    weapon.reserve -=
        amount;


    updateWeaponHUD();

}


/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(
    delta
) {

    if (
        gameOver
    ) {

        return;

    }


    for (
        let enemy of
        enemies
    ) {

        if (
            !enemy.alive
        ) {

            continue;

        }


        let direction =
            new THREE.Vector3();


        direction.subVectors(
            player.position,
            enemy.position
        );


        direction.y = 0;


        let distance =
            direction.length();


        if (
            distance >
            enemy.detectionRange
        ) {

            continue;

        }


        enemy.lookAt(
            player.position.x,
            enemy.position.y,
            player.position.z
        );


        if (
            distance > 18
        ) {

            direction.normalize();


            let movement =
                direction.clone()
                    .multiplyScalar(
                        enemy.moveSpeed *
                        delta
                    );


            let oldPosition =
                enemy.position.clone();


            moveWithCollision(
                enemy,
                movement,
                ENEMY_RADIUS
            );


            if (
                enemy.position.distanceTo(
                    oldPosition
                ) < 0.001
            ) {

                let slideX =
                    new THREE.Vector3(
                        movement.x,
                        0,
                        0
                    );


                let slideZ =
                    new THREE.Vector3(
                        0,
                        0,
                        movement.z
                    );


                moveWithCollision(
                    enemy,
                    slideX,
                    ENEMY_RADIUS
                );


                moveWithCollision(
                    enemy,
                    slideZ,
                    ENEMY_RADIUS
                );

            }


            enemy.walkTime +=
                delta * 8;


            enemy.leftLeg.rotation.x =
                Math.sin(
                    enemy.walkTime
                ) *
                0.5;


            enemy.rightLeg.rotation.x =
                Math.sin(
                    enemy.walkTime +
                    Math.PI
                ) *
                0.5;

        }


        enemy.shootTimer -=
            delta;


        if (
            distance <
            enemy.attackRange &&
            enemy.shootTimer <= 0
        ) {

            enemy.shootTimer =
                1.5 +
                Math.random() *
                1.5;


            enemyShoot(
                enemy
            );

        }

    }

}


/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(
    enemy
) {

    if (
        gameOver
    ) {

        return;

    }


    let start =
        enemy.position.clone();


    start.y += 2;


    let target =
        player.position.clone();


    target.y -= 0.3;


    let direction =
        new THREE.Vector3();


    direction.subVectors(
        target,
        start
    );


    direction.normalize();


    /* =================================================
       ENEMY AIM ERROR
    ================================================= */

    direction.x +=
        (
            Math.random() -
            0.5
        ) *
        0.035;


    direction.y +=
        (
            Math.random() -
            0.5
        ) *
        0.035;


    direction.z +=
        (
            Math.random() -
            0.5
        ) *
        0.035;


    direction.normalize();


    /* =================================================
       WALL CHECK BEFORE FIRING
    ================================================= */

    let raycaster =
        new THREE.Raycaster(
            start,
            direction
        );


    raycaster.far =
        150;


    let wallHits =
        raycaster.intersectObjects(
            walls,
            false
        );


    let playerDistance =
        start.distanceTo(
            target
        );


    if (
        wallHits.length > 0 &&
        wallHits[0].distance <
        playerDistance
    ) {

        return;

    }


    /* =================================================
       CREATE ENEMY PROJECTILE
    ================================================= */

    createProjectile(

        start,

        direction,

        false,

        5,

        35,

        5

    );

}


/* =====================================================
   DAMAGE PLAYER
===================================================== */

function takeDamage(
    damage
) {

    if (
        gameOver
    ) {

        return;

    }


    health -=
        damage;


    health =
        Math.max(
            0,
            health
        );


    updateHUD();


    let flash =
        document.getElementById(
            "damageFlash"
        );


    flash.style.opacity =
        1;


    setTimeout(
        function() {

            flash.style.opacity =
                0;

        },
        120
    );


    if (
        health <= 0
    ) {

        loseGame();

    }

}


/* =====================================================
   HUD
===================================================== */

function updateHUD() {

    document.getElementById(
        "scoreDisplay"
    ).textContent =
        score;


    document.getElementById(
        "kills"
    ).textContent =
        kills;


    document.getElementById(
        "enemyCount"
    ).textContent =

        enemies.filter(
            e =>
                e.alive
        ).length;


    document.getElementById(
        "health"
    ).style.width =
        health +
        "%";


    updateWeaponHUD();

}


/* =====================================================
   WAVE HUD
===================================================== */

function updateWaveHUD() {

    document.getElementById(
        "wave"
    ).textContent =
        currentWave;

}


/* =====================================================
   HIT MARKER
===================================================== */

let hitMarkerTimer = null;


function showHitMarker() {

    let marker =
        document.getElementById(
            "hitMarker"
        );


    marker.style.opacity =
        1;


    if (
        hitMarkerTimer
    ) {

        clearTimeout(
            hitMarkerTimer
        );

    }


    hitMarkerTimer =
        setTimeout(
            function() {

                marker.style.opacity =
                    0;

            },
            100
        );

}


/* =====================================================
   GAME OVER
===================================================== */

function loseGame() {

    if (
        gameOver
    ) {

        return;

    }


    gameOver =
        true;


    isFiring =
        false;


    document.getElementById(
        "messageText"
    ).textContent =
        "GAME OVER";


    document.getElementById(
        "finalScore"
    ).textContent =
        "FINAL SCORE: " +
        score;


    document.getElementById(
        "message"
    ).style.display =
        "block";

}


/* =====================================================
   RESIZE
===================================================== */

function resize() {

    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* =====================================================
   GAME LOOP
===================================================== */

let lastTime =
    performance.now();


function animate() {

    requestAnimationFrame(
        animate
    );


    let now =
        performance.now();


    let delta =
        (
            now -
            lastTime
        ) /
        1000;


    lastTime =
        now;


    delta =
        Math.min(
            delta,
            0.1
        );


    /* =================================================
       AUTOMATIC WEAPONS
    ================================================= */

    if (
        isFiring &&
        weapons[currentWeapon]
            .automatic
    ) {

        shoot();

    }


    /* =================================================
       PLAYER
    ================================================= */

    movePlayer(
        delta
    );


    /* =================================================
       ENEMIES
    ================================================= */

    updateEnemies(
        delta
    );


    /* =================================================
       PROJECTILES
    ================================================= */

    updateProjectiles(
        delta
    );


    /* =================================================
       WAVES
    ================================================= */

    updateWaveSystem(
        delta
    );


    /* =================================================
       GUN
    ================================================= */

    updateGun(
        delta
    );


    /* =================================================
       HUD
    ================================================= */

    updateHUD();


    /* =================================================
       RENDER
    ================================================= */

    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   START GAME
===================================================== */

startGame();

</script>
