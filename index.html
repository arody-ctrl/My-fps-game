function startWave() {


    if (gameOver)
        return;


    if (waveStarting)
        return;


    waveStarting = true;


    currentWave++;


    waveInProgress = true;


    waveEnemiesRemaining =

        5 +

        (

            currentWave -

            1

        ) *

        2;


    waveSpawnTimer = 0;


    updateWaveHUD();


    setTimeout(

        function() {

        500

    );

}


// =====================================================
// WAVE UPDATE
// =====================================================

function updateWaveSystem(

    delta

) {


    if (gameOver)
        return;


    if (!waveInProgress)
        return;


    let activeEnemies =

        enemies.filter(

            e => e.alive

        ).length;


    if (

        waveEnemiesRemaining >

        0 &&

        activeEnemies <

        MAX_ACTIVE_ENEMIES

    ) {


        waveSpawnTimer -= delta;


        if (

            waveSpawnTimer <= 0

        ) {


            spawnWaveEnemy();


            waveEnemiesRemaining--;


            waveSpawnTimer =

                0.7;

        }

    }


    let aliveEnemies =

        enemies.filter(

            e => e.alive

        ).length;


    if (

        waveEnemiesRemaining <= 0 &&

        aliveEnemies === 0

    ) {


        waveInProgress = false;


        setTimeout(

            function() {


                if (!gameOver) {

                    startWave();

                }


            },

            3000

        );

    }

}


// =====================================================
// SPAWN ENEMY
// =====================================================

function spawnWaveEnemy() {


    let spawn;

    let attempts = 0;


    do {


        spawn =

            spawnPoints[

                Math.floor(

                    Math.random() *

                    spawnPoints.length

                )

            ];


        attempts++;


        let distance =

            Math.hypot(

                spawn[0] -

                player.position.x,

                spawn[1] -

                player.position.z

            );


        if (

            distance >= 40

        ) {


            break;

        }


    }

    while (

        attempts < 30

    );


    createEnemy(

        spawn[0],

        spawn[1]

    );

}

function shoot() {


    if (gameOver)
        return;


    if (reloading)
        return;


    let weapon =

        weapons[currentWeapon];


    let now =

        performance.now();


    if (

        now -

        lastPlayerShot <

        weapon.fireRate

    ) {


        return;

    }


    lastPlayerShot =

        now;


    if (

        ammo <= 0

    ) {


        reload();


        return;

    }


    ammo--;


    updateHUD();


    // =========================
    // RAYCAST
    // =========================

    let raycaster =

        new THREE.Raycaster();


    // Larger hit detection radius

    raycaster.params.Mesh.threshold =

        0.25;


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    raycaster.far =

        weapon.range;


    let aliveEnemies =

        enemies.filter(

            e => e.alive

        );


    let hitObjects = [];


    for (

        let enemy of

        aliveEnemies

    ) {


        enemy.traverse(

            function(object) {


                if (

                    object.isMesh

                ) {


                    hitObjects.push(

                        object

                    );

                }

            }

        );

    }


    let hits =

        raycaster.intersectObjects(

            hitObjects,

            false

        );


    if (

        hits.length > 0

    ) {


        let enemy =

            hits[0].object;


        while (

            enemy.parent &&

            enemy.health ===

            undefined

        ) {


            enemy =

                enemy.parent;

        }


        if (

            enemy.alive

        ) {


            enemy.health -=

                weapon.damage;


            showHitMarker();


            if (

                enemy.health <= 0

            ) {


                killEnemy(

                    enemy

                );

            }

        }

    }

}

        return;


    enemy.alive = false;


    scene.remove(enemy);


    kills++;


    updateHUD();

}


// =====================================================
// ENEMY SHOOT
// =====================================================

function enemyShoot(

    enemy

) {


    if (gameOver)
        return;


    // Weapon position

    let start =

        enemy.position.clone();


    start.y += 2.2;


    start.z -= 1;


    // Aim at player

    let target =

        player.position.clone();


    target.y -= 0.4;


    let direction =

        new THREE.Vector3();


    direction.subVectors(

        target,

        start

    );


    direction.normalize();


    // Accuracy

    let accuracy =

        0.025;


    direction.x +=

        (

            Math.random() -

            0.5

        ) *

        accuracy;


    direction.y +=

        (

            Math.random() -

            0.5

        ) *

        accuracy;


    direction.z +=

        (

            Math.random() -

            0.5

        ) *

        accuracy;


    direction.normalize();


    // Visible projectile

    let geometry =

        new THREE.SphereGeometry(

            0.12,

            6,

            6

        );


    let material =

        new THREE.MeshBasicMaterial({

            color: 0xffff00

        });


    let projectile =

        new THREE.Mesh(

            geometry,

            material

        );


    projectile.position.copy(

        start

    );


    projectile.velocity =

        direction.multiplyScalar(

            45

        );


    projectile.damage =

        5;


    projectile.life =

        3;


    scene.add(

        projectile

    );


    enemyProjectiles.push(

        projectile

    );

}


// =====================================================
// UPDATE BOT PROJECTILES
// =====================================================

function updateEnemyProjectiles(

    delta

) {


    for (

        let i =

        enemyProjectiles.length -

        1;

        i >= 0;

        i--

    ) {


        let projectile =

            enemyProjectiles[i];


        projectile.position.add(

            projectile.velocity.clone()

            .multiplyScalar(

                delta

            )

        );


        projectile.life -=

            delta;


        // Check player hit

        let distance =

            projectile.position.distanceTo(

                player.position

            );


        if (

            distance < 1.5

        ) {


            takeDamage(

                projectile.damage

            );


            scene.remove(

                projectile

            );


            enemyProjectiles.splice(

                i,

                1

            );


            continue;

        }


        if (

            projectile.life <= 0

        ) {


            scene.remove(

                projectile

            );


            enemyProjectiles.splice(

                i,

                1

            );

        }

    }

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(

    delta

) {


    if (gameOver)
        return;


    for (

        let enemy of

        enemies

    ) {


        if (!enemy.alive)
            continue;


        let direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y = 0;


        let distance =

            direction.length();


        if (

            distance >

            enemy.detectionRange

        ) {


            continue;

        }


        // Face player

        enemy.lookAt(

            player.position.x,

            enemy.position.y,

            player.position.z

        );


        // Move

        if (

            distance > 18

        ) {


            direction.normalize();


            enemy.position.add(

                direction.multiplyScalar(

                    enemy.moveSpeed *

                    delta

                )

            );


            enemy.walkTime +=

                delta *

                8;


            enemy.leftLeg.rotation.x =

                Math.sin(

                    enemy.walkTime

                ) *

                0.5;


            enemy.rightLeg.rotation.x =

                Math.sin(

                    enemy.walkTime +

                    Math.PI

                ) *

                0.5;

        }


        // Shoot

        enemy.shootTimer -=

            delta;


        if (

            distance <

            enemy.attackRange &&

            enemy.shootTimer <= 0

        ) {


            enemy.shootTimer =

                1.5 +

                Math.random() *

                1.5;


            enemyShoot(

                enemy

            );

        }

    }

}


// =====================================================
// DAMAGE
// =====================================================

function takeDamage(

    damage

) {


    if (gameOver)
        return;


    health -=

        damage;


    health =

        Math.max(

            0,

            health

        );


    updateHUD();


    let flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity =

        1;


    setTimeout(

        function() {

            flash.style.opacity =

                0;

        },

        120

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}


// =====================================================
// RELOAD
// =====================================================

function reload() {


    if (reloading)
        return;


    let weapon =

        weapons[currentWeapon];


    let needed =

        weapon.magazine -

        ammo;


    if (

        needed <= 0 ||

        reserve <= 0

    ) {


        return;

    }


    reloading = true;


    document.getElementById(

        "reload"

    ).textContent =

        "RELOADING";


    setTimeout(

        function() {


            let amount =

                Math.min(

                    needed,

                    reserve

                );


            ammo +=

                amount;


            reserve -=

                amount;


            reloading = false;


            document.getElementById(

                "reload"

            ).textContent =

                "RELOAD";


            updateHUD();


        },

        800

    );

}

// HUD

function updateHUD() {

        "ammo"

    ).textContent =

    document.getElementById(

    document.getElementById(

// =====================================================
// MINIMAP
// =====================================================

function updateMinimap() {


    let canvas =

        document.getElementById(

            "minimap"

        );


    let ctx =

        canvas.getContext(

            "2d"

        );


    let size = 160;


    ctx.clearRect(

        0,

        0,

        size,

        size

    );


    // Background

    ctx.fillStyle =

        "#222";


    ctx.fillRect(

        0,

        0,

        size,

        size

    );


    // Map scale

    let scale =

        size /

        250;


    // Draw walls

    ctx.fillStyle =

        "#777";


    for (

        let wall of

        walls

    ) {


        let box =

            new THREE.Box3()

            .setFromObject(

                wall

            );


        let x =

            (

                box.min.x +

                125

            ) *

            scale;


        let y =

            (

                box.min.z +

                125

            ) *

            scale;


        let width =

            (

                box.max.x -

                box.min.x

            ) *

            scale;


        let height =

            (

                box.max.z -

                box.min.z

            ) *

            scale;


        ctx.fillRect(

            x,

            y,

            width,

            height

        );

    }


    // Enemies

    for (

        let enemy of

        enemies

    ) {


        if (!enemy.alive)
            continue;


        let x =

            (

                enemy.position.x +

                125

            ) *

            scale;


        let y =

            (

                enemy.position.z +

                125

            ) *

            scale;


        ctx.fillStyle =

            "red";


        ctx.beginPath();


        ctx.arc(

            x,

            y,

            3,

            0,

            Math.PI * 2

        );


        ctx.fill();

    }


    // Player

    let px =

        (

            player.position.x +

            125

        ) *

        scale;


    let py =

        (

            player.position.z +

            125

        ) *

        scale;


    ctx.fillStyle =

        "lime";


    ctx.beginPath();


    ctx.arc(

        px,

        py,

        5,

        0,

        Math.PI * 2

    );


    ctx.fill();


    // Player direction

    let directionX =

        Math.sin(

            rotationY

        );


    let directionY =

        -Math.cos(

            rotationY

        );


    ctx.strokeStyle =

        "lime";


    ctx.lineWidth = 2;


    ctx.beginPath();


    ctx.moveTo(

        px,

        py

    );


    ctx.lineTo(

        px +

        directionX *

        12,

        py +

        directionY *

        12

    );


    ctx.stroke();

}

    gameOver = true;

function resize() {

// =====================================================
// CONTROLS
// =====================================================

function setupControls() {


    let joystick =

        document.getElementById(

            "joystick"

        );


    let stick =

        document.getElementById(

            "stick"

        );


    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]

                .identifier;

        },

        {

            passive: false

        }

    );


    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            if (

                joystickTouch === null

            )
                return;


            let touch =

                [...e.touches]

                .find(

                    t =>

                    t.identifier ===

                    joystickTouch

                );


            if (!touch)
                return;


            let rect =

                joystick

                .getBoundingClientRect();


            let x =

                touch.clientX -

                (

                    rect.left +

                    rect.width /

                    2

                );


            let y =

                touch.clientY -

                (

                    rect.top +

                    rect.height /

                    2

                );


            let max = 40;


            let distance =

                Math.sqrt(

                    x*x +

                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /

                    distance *

                    max;


                y =

                    y /

                    distance *

                    max;

            }


            joyX =

                x /

                max;


            joyY =

                y /

                max;


            stick.style.transform =

                "translate(" +

                x +

                "px," +

                y +

                "px)";

        },

        {

            passive: false

        }

    );


    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch =

                null;


            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0px,0px)";

        }

    );


    // AIM

    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.clientX >

                    window.innerWidth /

                    2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.identifier ===

                    aimTouch

                ) {


                    let dx =

                        touch.clientX -

                        lastX;


                    let dy =

                        touch.clientY -

                        lastY;


                    rotationY -=

                        dx *

                        0.004;


                    rotationX -=

                        dy *

                        0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                let touch of

                e.changedTouches

            ) {


                if (

                    touch.identifier ===

                    aimTouch

                ) {


                    aimTouch = null;

                }

            }

        }

    );


    // FIRE

    document

        .getElementById("fire")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                shoot();

            },

            {

                passive: false

            }

        );


    // RELOAD

    document

        .getElementById("reload")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            {

                passive: false

            }

        );


    // SWITCH WEAPON

    document

        .getElementById("switchWeapon")

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                switchWeapon();

            },

            {

                passive: false

            }

        );


    // RESTART

    document

        .getElementById("restart")

        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// =====================================================
// PLAYER MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    let speed = 8;


    let forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    let right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        player.position.add(

            movement.multiplyScalar(

                speed *

                delta

            )

        );

    }


    player.position.x =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.z

            )

        );

}


// =====================================================
// ANIMATE
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    let now =

        performance.now();


    let delta =

        (

            now -

            lastTime

        ) /

        1000;


    lastTime = now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    updateWaveSystem(

        delta

    );


    updateEnemyProjectiles(

        delta

    );


    updateMinimap();


    updateHUD();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();
