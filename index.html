<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile FPS V6.5 - Airdrops + Sniper Edition</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87CEEB;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* HUD */
#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-size:17px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:10;
    user-select:none;
}

#healthBar{
    width:180px;
    height:20px;
    margin-top:4px;
    background:#333;
    border:2px solid white;
}

#health{
    width:100%;
    height:100%;
    background:lime;
    transition:width .2s;
}

.stat{margin-top:5px}

#scoreDisplay{
    color:gold;
    font-size:22px;
    margin-top:7px;
    text-shadow:2px 2px 4px black;
}

/* WEAPON HUD */
#weaponHUD{
    position:fixed;
    top:15px;
    right:15px;
    color:white;
    text-align:right;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:10;
}

#weaponName{font-size:24px}
#adsStatus{font-size:14px;margin-top:4px}

/* CROSSHAIR */
#crosshair{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    pointer-events:none;
    z-index:5;
}

/* SNIPER SCOPE */
#scopeOverlay{
    position:fixed;
    inset:0;
    display:none;
    pointer-events:none;
    z-index:4;
}

#scopeOverlay::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:min(85vw,85vh);
    transform:translate(-50%,-50%);
    border:8px solid rgba(0,0,0,.9);
    border-radius:50%;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.65),
        inset 0 0 30px black;
}

#scopeOverlay::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:2px;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.75);
    box-shadow:0 calc(min(85vw,85vh) / 2) 0 rgba(255,255,255,0);
}

#scopeCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:min(85vw,85vh);
    transform:translate(-50%,-50%);
}

#scopeCenter::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(255,255,255,.75);
}

#scopeCenter::after{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:2px;
    background:rgba(255,255,255,.75);
}

/* HIT */
#hitMarker{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    z-index:15;
}

/* SCORE */
#scorePopup{
    position:fixed;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    color:gold;
    font-size:26px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:30;
}

/* DAMAGE */
#damageFlash{
    position:fixed;
    inset:0;
    background:rgba(255,0,0,.3);
    opacity:0;
    pointer-events:none;
    z-index:14;
}

/* AIRDROP MESSAGE */
#airdropMessage{
    position:fixed;
    top:25%;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:50;
    transition:opacity .2s;
}

/* AIRDROP INFO */
#airdropInfo{
    position:fixed;
    top:32%;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:50;
}

/* JOYSTICK */
#joystick{
    position:fixed;
    left:25px;
    bottom:30px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    border:3px solid rgba(255,255,255,.5);
    z-index:20;
    touch-action:none;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    left:40px;
    top:40px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    pointer-events:none;
}

/* FIRE */
#fire{
    position:fixed;
    right:25px;
    bottom:35px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:red;
    color:white;
    border:3px solid white;
    font-weight:bold;
    font-size:18px;
    z-index:20;
    touch-action:none;
}

/* ADS */
#ads{
    position:fixed;
    right:130px;
    bottom:45px;
    width:80px;
    height:65px;
    border-radius:15px;
    background:#333;
    color:white;
    border:3px solid white;
    font-weight:bold;
    z-index:20;
    touch-action:none;
}

/* RELOAD */
#reload{
    position:fixed;
    right:35px;
    bottom:205px;
    width:80px;
    height:45px;
    background:black;
    color:white;
    border:2px solid white;
    border-radius:8px;
    z-index:20;
    touch-action:none;
}

/* WEAPONS */
#weaponButtons{
    position:fixed;
    left:175px;
    bottom:25px;
    display:flex;
    gap:6px;
    z-index:20;
}

.weaponButton{
    width:55px;
    height:48px;
    background:#222;
    color:white;
    border:2px solid white;
    border-radius:8px;
    font-weight:bold;
    font-size:11px;
}

.weaponButton.active{
    background:#ff9900;
    color:black;
}

/* GAME MESSAGE */
#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    text-align:center;
    text-shadow:3px 3px 5px black;
    z-index:100;
    display:none;
}

#finalScore{
    color:gold;
    font-size:25px;
    margin-top:10px;
}

#restart{
    margin-top:20px;
    padding:12px 25px;
    background:black;
    color:white;
    border:2px solid white;
    border-radius:8px;
    font-size:18px;
}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

/* =====================================================
   CORE GAME
===================================================== */

let scene;
let camera;
let renderer;
let player;

let enemies = [];
let walls = [];
let projectiles = [];
let airdrops = [];

let health = 100;
let kills = 0;
let score = 0;

let gameOver = false;

/* =====================================================
   SHARED UTILITIES
===================================================== */

function el(id){

    return document.getElementById(id);

}

function setText(id,value){

    el(id).textContent=value;

}

function setDisplay(id,visible){

    el(id).style.display=
        visible?"block":"none";

}

const fadeTimers={};

function flashElement(id,duration,text){

    let element=el(id);

    if(text!==undefined){

        element.textContent=text;

    }

    element.style.opacity=1;

    if(fadeTimers[id]){

        clearTimeout(fadeTimers[id]);

    }

    fadeTimers[id]=
        setTimeout(
            function(){

                element.style.opacity=0;

                fadeTimers[id]=null;

            },
            duration
        );

}

function onTouchStart(element,handler){

    element.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            handler(e);

        },
        {
            passive:false
        }
    );

}

function clamp(value,min,max){

    return Math.max(
        min,
        Math.min(max,value)
    );

}

function randomRange(min,max){

    return min+
        Math.random()*(max-min);

}

function randomInt(min,max){

    return Math.floor(
        randomRange(min,max+1)
    );

}

function pickRandom(list){

    return list[
        Math.floor(
            Math.random()*list.length
        )
    ];

}

function horizontalDistance(a,b){

    return Math.hypot(
        a.x-b.x,
        a.z-b.z
    );

}

function aliveEnemyCount(){

    return enemies.filter(
        enemy=>enemy.alive
    ).length;

}

function applySpread(direction,spread){

    if(spread<=0)return direction;

    direction.x+=
        (Math.random()-.5)*spread;

    direction.y+=
        (Math.random()-.5)*spread;

    direction.z+=
        (Math.random()-.5)*spread;

    return direction.normalize();

}

function setCameraFOV(fov){

    camera.fov=fov;

    camera.updateProjectionMatrix();

}

function setScopeUI(scoped){

    setDisplay("scopeOverlay",scoped);

    setDisplay("crosshair",!scoped);

}

/* MESH BUILDING */

function standardMaterial(color){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.7,
        metalness:.2
    });

}

function addBox(
    parent,
    size,
    material,
    position,
    rotation
){

    let mesh=new THREE.Mesh(
        new THREE.BoxGeometry(
            size[0],
            size[1],
            size[2]
        ),
        typeof material==="number"?
            standardMaterial(material):
            material
    );

    return addPart(
        parent,
        mesh,
        position,
        rotation
    );

}

function addPart(
    parent,
    mesh,
    position,
    rotation
){

    if(position){

        mesh.position.set(
            position[0],
            position[1],
            position[2]
        );

    }

    if(rotation){

        mesh.rotation.set(
            rotation[0],
            rotation[1],
            rotation[2]
        );

    }

    parent.add(mesh);

    return mesh;

}

const SIGHT_COLOR=0x111111;

/*
   IRON SIGHT:
   A base block with one or more
   posts standing on top of it.
*/

function addIronSight(parent,options){

    addBox(
        parent,
        options.baseSize,
        SIGHT_COLOR,
        [0,options.baseY,options.z]
    );

    for(
        let offset of
        (options.postOffsets||[0])
    ){

        addBox(
            parent,
            options.postSize,
            SIGHT_COLOR,
            [offset,options.postY,options.z]
        );

    }

}


/* =====================================================
   WEAPONS
===================================================== */

const weapons=GameCore.createWeapons();

let currentWeapon="AR";
let isADS=false;
let isFiring=false;
let lastPlayerShot=0;

/* =====================================================
   WEAPON UPGRADES
   MAX 4 UPGRADES PER WEAPON
===================================================== */

const MAX_UPGRADES=GameCore.MAX_UPGRADES;

const upgradeTypes=GameCore.upgradeTypes;

/* =====================================================
   LOW POLY GUN
===================================================== */

let gunModel;
let gunRecoil=0;
let gunBobTime=0;

function createGunModel(){

    if(gunModel){
        gunModel.visible=true;
    }

    gunModel=new THREE.Group();

    gunModel.position.set(
        .45,
        -.38,
        -.75
    );

    camera.add(gunModel);

    gunBuilders[currentWeapon]();

}

/* =====================================================
   AR
===================================================== */

function createARModel(){

    addBox(
        gunModel,
        [.25,.25,1.1],
        0x222222,
        [0,0,-.35]
    );

    addBox(
        gunModel,
        [.09,.09,.65],
        SIGHT_COLOR,
        [0,0,-1.15]
    );

    addBox(
        gunModel,
        [.22,.22,.45],
        0x333333,
        [0,0,.4]
    );

    addBox(
        gunModel,
        [.16,.35,.18],
        SIGHT_COLOR,
        [0,-.25,0],
        [-.2,0,0]
    );

    addBox(
        gunModel,
        [.15,.5,.2],
        SIGHT_COLOR,
        [0,-.28,-.25],
        [.2,0,0]
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.12,.08,.12],
            baseY:.18,
            postSize:[.035,.12,.035],
            postY:.25,
            z:.05
        }
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.1,.07,.1],
            baseY:.17,
            postSize:[.035,.14,.035],
            postY:.25,
            z:-.82
        }
    );

}


/* =====================================================
   SMG
===================================================== */

function createSMGModel(){

    addBox(
        gunModel,
        [.28,.28,.75],
        0x333333,
        [0,0,-.35]
    );

    addBox(
        gunModel,
        [.1,.1,.35],
        SIGHT_COLOR,
        [0,0,-.9]
    );

    addBox(
        gunModel,
        [.18,.35,.18],
        SIGHT_COLOR,
        [0,-.28,-.05]
    );

    addBox(
        gunModel,
        [.15,.45,.18],
        SIGHT_COLOR,
        [0,-.28,-.35]
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.12,.08,.12],
            baseY:.18,
            postSize:[.035,.11,.035],
            postY:.25,
            z:-.02
        }
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.1,.07,.1],
            baseY:.16,
            postSize:[.035,.12,.035],
            postY:.24,
            z:-.72
        }
    );

}


/* =====================================================
   PISTOL
===================================================== */

function createPistolModel(){

    gunModel.position.set(
        .38,
        -.42,
        -.7
    );

    addBox(
        gunModel,
        [.25,.3,.65],
        0x222222,
        [0,0,-.25]
    );

    addBox(
        gunModel,
        [.12,.12,.3],
        SIGHT_COLOR,
        [0,0,-.72]
    );

    addBox(
        gunModel,
        [.18,.5,.2],
        SIGHT_COLOR,
        [0,-.35,.02],
        [-.15,0,0]
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.08,.05,.08],
            baseY:.18,
            postSize:[.025,.1,.025],
            postY:.25,
            z:-.67
        }
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.1,.06,.08],
            baseY:.19,
            postSize:[.025,.1,.025],
            postY:.25,
            postOffsets:[-.04,.04],
            z:-.02
        }
    );

}


/* =====================================================
   SNIPER / SR
===================================================== */

function createSniperModel(){

    gunModel.position.set(
        .42,
        -.35,
        -.85
    );

    /* MAIN BODY */

    addBox(
        gunModel,
        [.28,.3,1.5],
        0x222222,
        [0,0,-.35]
    );

    /* BARREL */

    addBox(
        gunModel,
        [.1,.1,1.3],
        SIGHT_COLOR,
        [0,0,-1.65]
    );

    /* STOCK */

    addBox(
        gunModel,
        [.25,.3,.55],
        0x333333,
        [0,0,.7]
    );

    /* =================================================
       SNIPER SCOPE
    ================================================= */

    let scopeGroup=new THREE.Group();

    scopeGroup.name="sniperScope";

    gunModel.add(scopeGroup);

    addPart(
        scopeGroup,
        new THREE.Mesh(
            new THREE.CylinderGeometry(
                .13,
                .13,
                .65,
                12
            ),
            standardMaterial(SIGHT_COLOR)
        ),
        [0,.25,-.45],
        [Math.PI/2,0,0]
    );

    /* SCOPE RINGS */

    for(
        let ringZ of
        [-.78,-.12]
    ){

        addPart(
            scopeGroup,
            new THREE.Mesh(
                new THREE.TorusGeometry(
                    .14,
                    .035,
                    8,
                    16
                ),
                standardMaterial(SIGHT_COLOR)
            ),
            [0,.25,ringZ],
            [Math.PI/2,0,0]
        );

    }

    /* =================================================
       RED DOT SIGHT
    ================================================= */

    let redDotGroup=new THREE.Group();

    redDotGroup.name="redDotSight";

    gunModel.add(redDotGroup);

    addBox(
        redDotGroup,
        [.18,.06,.28],
        SIGHT_COLOR,
        [0,.42,-.25]
    );

    addBox(
        redDotGroup,
        [.2,.18,.28],
        0x222222,
        [0,.52,-.25]
    );

    /* RED DOT GLASS */

    addBox(
        redDotGroup,
        [.13,.1,.02],
        new THREE.MeshBasicMaterial({
            color:0x330000,
            transparent:true,
            opacity:.8
        }),
        [0,.52,-.395]
    );

    /* ACTUAL RED DOT */

    addPart(
        redDotGroup,
        new THREE.Mesh(
            new THREE.SphereGeometry(
                .025,
                8,
                8
            ),
            new THREE.MeshBasicMaterial({
                color:0xff0000
            })
        ),
        [0,.52,-.41]
    );

    /* SNIPER SIGHTS */

    addIronSight(
        gunModel,
        {
            baseSize:[.1,.07,.1],
            baseY:.17,
            postSize:[.035,.14,.035],
            postY:.25,
            z:-1.55
        }
    );

    addIronSight(
        gunModel,
        {
            baseSize:[.12,.08,.12],
            baseY:.18,
            postSize:[.035,.12,.035],
            postY:.25,
            postOffsets:[-.05,.05],
            z:.02
        }
    );

}

const gunBuilders={
    AR:createARModel,
    SMG:createSMGModel,
    PISTOL:createPistolModel,
    SNIPER:createSniperModel
};

/* GUN ANIMATION */

function updateGun(delta){

    if(!gunModel)return;

    gunRecoil=THREE.MathUtils.lerp(
        gunRecoil,
        0,
        delta*12
    );

    let targetX=isADS?0:.45;
    let targetY=isADS?-.28:-.38;
    let targetZ=isADS?-.9:-.75;

    if(currentWeapon==="PISTOL"){
        targetX=isADS?0:.38;
    }

    if(currentWeapon==="SNIPER"){
        targetX=isADS?0:.42;
    }

    gunModel.position.x=
        THREE.MathUtils.lerp(
            gunModel.position.x,
            targetX,
            delta*10
        );

    gunModel.position.y=
        THREE.MathUtils.lerp(
            gunModel.position.y,
            targetY,
            delta*10
        );

    gunModel.position.z=
        THREE.MathUtils.lerp(
            gunModel.position.z,
            targetZ+gunRecoil,
            delta*15
        );

    if(
        Math.abs(joyX)>.1||
        Math.abs(joyY)>.1
    ){

        gunBobTime+=delta*8;

        gunModel.position.y+=
            Math.sin(gunBobTime)*.015;

        gunModel.position.x+=
            Math.cos(gunBobTime*.5)*.01;

    }

}

function fireGunAnimation(){

    gunRecoil=.12;

}

/* =====================================================
   WAVES
===================================================== */

let currentWave=0;
let waveInProgress=false;
let waveEnemiesRemaining=0;
let waveSpawnTimer=0;
let waveStarting=false;

const MAX_ACTIVE_ENEMIES=15;

/* =====================================================
   MAP
===================================================== */

const MAP_SIZE=250;
const PLAYER_RADIUS=1.2;
const ENEMY_RADIUS=1.4;

const spawnPoints=[

    [-110,-110],
    [-80,-110],
    [-40,-110],
    [0,-110],
    [40,-110],
    [80,-110],
    [110,-110],

    [-110,110],
    [-80,110],
    [-40,110],
    [0,110],
    [40,110],
    [80,110],
    [110,110],

    [-110,-60],
    [110,-60],
    [-110,0],
    [110,0],
    [-110,60],
    [110,60]

];

/* =====================================================
   CONTROLS
===================================================== */

let joyX=0;
let joyY=0;

let joystickTouch=null;
let aimTouch=null;

let lastX=0;
let lastY=0;

let rotationY=0;
let rotationX=0;

/* =====================================================
   AIRDROP SYSTEM
===================================================== */

let nextAirdropTimer=15;
let airdropDropHeight=80;
let airdropFallSpeed=12;
let airdropCollectDistance=5;
let airdropId=0;

function showAirdropMessage(text){

    flashElement(
        "airdropMessage",
        2200,
        text
    );

}

function showAirdropInfo(text){

    flashElement(
        "airdropInfo",
        4500,
        text
    );

}

function randomAirdropPosition(){

    return GameCore.randomAirdropPosition(
        walls
    );

}

function createAirdrop(){

    if(gameOver)return;

    let position=
        randomAirdropPosition();

    let group=
        new THREE.Group();

    /* CRATE */

    addBox(
        group,
        [3,2,3],
        new THREE.MeshStandardMaterial({
            color:0x8B4513,
            roughness:.8
        })
    );

    /* STRAPS */

    let strapMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffff00
        });

    addBox(
        group,
        [.25,2.1,3.1],
        strapMaterial
    );

    addBox(
        group,
        [3.1,2.1,.25],
        strapMaterial
    );

    /* PARACHUTE */

    addPart(
        group,
        new THREE.Mesh(
            new THREE.SphereGeometry(
                5,
                12,
                6,
                0,
                Math.PI*2,
                0,
                Math.PI/2
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff,
                side:THREE.DoubleSide
            })
        ),
        [0,10,0]
    );

    /* ROPES */

    let ropeMaterial=
        new THREE.LineBasicMaterial({
            color:0xffffff
        });

    for(
        let i=0;
        i<4;
        i++
    ){

        let angle=
            i*Math.PI/2;

        let points=[
            new THREE.Vector3(
                Math.cos(angle)*4,
                9,
                Math.sin(angle)*4
            ),
            new THREE.Vector3(
                Math.cos(angle)*1.3,
                1,
                Math.sin(angle)*1.3
            )
        ];

        let geometry=
            new THREE.BufferGeometry()
                .setFromPoints(points);

        let line=
            new THREE.Line(
                geometry,
                ropeMaterial
            );

        group.add(line);

    }

    group.position.set(
        position.x,
        airdropDropHeight,
        position.z
    );

    group.userData={
        landed:false,
        collected:false,
        id:++airdropId,
        velocity:airdropFallSpeed
    };

    scene.add(group);

    airdrops.push(group);

    showAirdropMessage(
        "✈ AIRDROP INCOMING!"
    );

}

function updateAirdrops(delta){

    if(gameOver)return;

    nextAirdropTimer-=delta;

    if(
        nextAirdropTimer<=0
    ){

        createAirdrop();

        nextAirdropTimer=
            randomRange(30,60);

    }

    for(
        let i=airdrops.length-1;
        i>=0;
        i--
    ){

        let drop=
            airdrops[i];

        if(
            !drop||
            drop.userData.collected
        ){

            continue;

        }

        if(
            !drop.userData.landed
        ){

            drop.position.y-=
                drop.userData.velocity*
                delta;

            if(
                drop.position.y<=2
            ){

                drop.position.y=2;

                drop.userData.landed=true;

                /* HIDE PARACHUTE */

                if(drop.children.length>0){

                    for(
                        let j=0;
                        j<drop.children.length;
                        j++
                    ){

                        if(
                            j>=3
                        ){

                            drop.children[j]
                                .visible=false;

                        }

                    }

                }

                showAirdropMessage(
                    "📦 AIRDROP LANDED!"
                );

            }

        }

        let distance=
            horizontalDistance(
                player.position,
                drop.position
            );

        if(
            distance<
            airdropCollectDistance
        ){

            if(
                drop.userData.landed
            ){

                collectAirdrop(
                    drop
                );

            }

        }

    }

    updateAirdropHUD();

}

function collectAirdrop(drop){

    if(
        drop.userData.collected
    )return;

    drop.userData.collected=true;

    /* HEALTH */

    let healthAmount=
        randomInt(25,50);

    health=
        GameCore.airdropHealth(
            health,
            healthAmount
        );

    /* AMMO */

    GameCore.restockReserves(
        weapons
    );

    /* RANDOM UPGRADES */

    let upgradeCount=
        randomInt(1,4);

    let upgradesReceived=
        GameCore.applyUpgrades(
            weapons[currentWeapon],
            upgradeCount
        );

    score+=GameCore.AIRDROP_SCORE;

    showScorePopup(
        "+500 AIRDROP"
    );

    let text=
        "AIRDROP COLLECTED!<br>"+
        "HEALTH +"+
        healthAmount+
        "<br>"+
        "AMMO RESTOCKED";

    if(
        upgradesReceived.length>0
    ){

        text+=
            "<br>UPGRADES:"+
            "<br>"+
            upgradesReceived.join(
                "<br>"
            );

    }

    showAirdropMessage(
        "AIRDROP COLLECTED!"
    );

    showAirdropInfo(
        text
    );

    updateHUD();

    if(drop.parent){

        scene.remove(drop);

    }

    let index=
        airdrops.indexOf(
            drop
        );

    if(index!==-1){

        airdrops.splice(
            index,
            1
        );

    }

}

function updateAirdropHUD(){

    setText(
        "airdropCount",
        airdrops.filter(
            d=>
                d &&
                !d.userData.collected
        ).length
    );

}

function startGame(){

    scene=new THREE.Scene();

    scene.background=
        new THREE.Color(
            0x87CEEB
        );

    camera=
        new THREE.PerspectiveCamera(
            75,
            window.innerWidth/
            window.innerHeight,
            .1,
            1000
        );

    renderer=
        new THREE.WebGLRenderer({
            antialias:true,
            powerPreference:
                "high-performance"
        });

    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            1.5
        )
    );

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

    renderer.outputEncoding=
        THREE.sRGBEncoding;

    document.body.appendChild(
        renderer.domElement
    );

    let light=
        new THREE.HemisphereLight(
            0xffffff,
            0x444444,
            2
        );

    scene.add(light);

    player=
        new THREE.Object3D();

    player.position.set(
        0,
        2,
        0
    );

    scene.add(player);

    player.add(camera);

    createGunModel();

    createGround();

    createMap();

    setupControls();

    updateWeaponHUD();

    updateHUD();

    window.addEventListener(
        "resize",
        resize
    );

    setTimeout(
        function(){
            startWave();
        },
        1000
    );

    animate();

}

function createGround(){

            color:0x228B22

/* =====================================================
   WALL
===================================================== */

function createWall(
    x,
    z,
    width,
    depth,
    height=4
){

    let geometry=
        new THREE.BoxGeometry(
            width,
            height,
            depth
        );

    let material=
        new THREE.MeshStandardMaterial({
            color:0x777777,
            roughness:.8
        });

    let wall=
        new THREE.Mesh(
            geometry,
            material
        );

    wall.position.set(
        x,
        height/2,
        z
    );

    wall.userData.halfWidth=
        width/2;

    wall.userData.halfDepth=
        depth/2;

    scene.add(wall);

    walls.push(wall);

    return wall;

}

/* =====================================================
   WAVES
===================================================== */

function startWave(){

    if(gameOver)return;

    if(waveStarting)return;

    waveStarting=true;

    currentWave++;

    waveInProgress=true;

    waveEnemiesRemaining=
        GameCore.waveEnemyCount(
            currentWave
        );

    waveSpawnTimer=0;

    updateWaveHUD();

    setTimeout(
        function(){

            waveStarting=false;

        },
        500
    );

}

function updateWaveSystem(delta){

    if(gameOver)return;

    if(!waveInProgress)return;

    let activeEnemies=
        aliveEnemyCount();

    if(
        waveEnemiesRemaining>0&&
        activeEnemies<
            MAX_ACTIVE_ENEMIES
    ){

        waveSpawnTimer-=delta;

        if(
            waveSpawnTimer<=0
        ){

            spawnWaveEnemy();

            waveEnemiesRemaining--;

            waveSpawnTimer=.7;

        }

    }

    let aliveEnemies=
        aliveEnemyCount();

    if(
        waveEnemiesRemaining<=0&&
        aliveEnemies===0
    ){

        waveInProgress=false;

        let waveBonus=
            GameCore.waveBonus(
                currentWave
            );

        score+=waveBonus;

        showScorePopup(
            "+"+
            waveBonus+
            " WAVE BONUS"
        );

        updateHUD();

        setTimeout(
            function(){

                if(!gameOver)
                    startWave();

            },
            3000
        );

    }

}

function spawnWaveEnemy(){

    if(gameOver)return;

    let attempts=0;

    let x=0;
    let z=0;

    while(
        attempts<30
    ){

        let spawn=
            pickRandom(spawnPoints);

        x=spawn[0];
        z=spawn[1];

        let distance=
            horizontalDistance(
                {
                    x:x,
                    z:z
                },
                player.position
            );

        if(
            distance>=40&&
            !circleIntersectsWall(
                x,
                z,
                ENEMY_RADIUS
            )
        ){

            break;

        }

        attempts++;

    }

    createEnemy(
        x,
        z
    );

}

/* =====================================================
   ENEMY
===================================================== */

function createEnemy(
    x,
    z
){

    let enemy=
        new THREE.Group();

    let bodyMaterial=
        new THREE.MeshStandardMaterial({
            color:0xff3333,
            metalness:.5,
            roughness:.5
        });

    addBox(
        enemy,
        [2,2.2,1.5],
        bodyMaterial,
        [0,2.2,0]
    );

    addBox(
        enemy,
        [1.5,1.2,1.5],
        new THREE.MeshStandardMaterial({
            color:0x555555,
            metalness:.8,
            roughness:.3
        }),
        [0,4,0]
    );

    let eyeMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffff00
        });

    for(
        let side of
        [-.4,.4]
    ){

        addBox(
            enemy,
            [.25,.25,.1],
            eyeMaterial,
            [side,4,-.78]
        );

    }

    let leftLeg=
        addBox(
            enemy,
            [.55,1.7,.55],
            bodyMaterial,
            [-.5,.8,0]
        );

    let rightLeg=
        addBox(
            enemy,
            [.55,1.7,.55],
            bodyMaterial,
            [.5,.8,0]
        );

    for(
        let side of
        [-1.3,1.3]
    ){

        addBox(
            enemy,
            [.5,1.8,.5],
            bodyMaterial,
            [side,2.2,0]
        );

    }

    enemy.position.set(
        x,
        0,
        z
    );

    enemy.health=100;
    enemy.maxHealth=100;
    enemy.alive=true;

    enemy.detectionRange=150;
    enemy.attackRange=60;

    enemy.moveSpeed=
        randomRange(1.2,1.7);

    enemy.shootTimer=
        randomRange(1,3);

    enemy.walkTime=
        Math.random()*10;

    enemy.leftLeg=
        leftLeg;

    enemy.rightLeg=
        rightLeg;

    scene.add(enemy);

    enemies.push(enemy);

    return enemy;

}

){

    if(!enemy.alive)return;

    enemy.alive=false;

    scene.remove(enemy);

            player.position.distanceTo(

    score+=points;

    showScorePopup(

    updateHUD();

}

/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    let joystick=
        el("joystick");

    let stick=
        el("stick");

    joystick.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            if(
                joystickTouch!==null
            )
                return;

            joystickTouch=
                e.changedTouches[0]
                    .identifier;

        },
        {
            passive:false
        }
    );

    joystick.addEventListener(
        "touchmove",
        function(e){

            e.preventDefault();

            if(
                joystickTouch===null
            )
                return;

            let touch=
                [...e.touches].find(
                    t=>
                        t.identifier===
                        joystickTouch
                );

            if(!touch)return;

            let rect=
                joystick.getBoundingClientRect();

            let x=
                touch.clientX-
                (
                    rect.left+
                    rect.width/2
                );

            let y=
                touch.clientY-
                (
                    rect.top+
                    rect.height/2
                );

            let max=40;

            let distance=
                Math.hypot(
                    x,
                    y
                );

            if(
                distance>max
            ){

                x=
                    x/
                    distance*
                    max;

                y=
                    y/
                    distance*
                    max;

            }

            joyX=x/max;
            joyY=y/max;

            stick.style.transform=
                "translate("+
                x+
                "px,"+
                y+
                "px)";

        },
        {
            passive:false
        }
    );

    function resetJoystick(){

        joystickTouch=null;

        joyX=0;
        joyY=0;

        stick.style.transform=
            "translate(0px,0px)";

    }

    joystick.addEventListener(
        "touchend",
        resetJoystick
    );

    joystick.addEventListener(
        "touchcancel",
        resetJoystick
    );

    renderer.domElement.addEventListener(
        "touchstart",
        function(e){

            for(
                let touch of
                e.changedTouches
            ){

                if(
                    touch.clientX>
                    window.innerWidth/2
                ){

                    if(
                        aimTouch===null
                    ){

                        aimTouch=
                            touch.identifier;

                        lastX=
                            touch.clientX;

                        lastY=
                            touch.clientY;

                    }

                }

            }

        },
        {
            passive:true
        }
    );

    renderer.domElement.addEventListener(
        "touchmove",
        function(e){

            for(
                let touch of
                e.changedTouches
            ){

                if(
                    touch.identifier===
                    aimTouch
                ){

                    let dx=
                        touch.clientX-
                        lastX;

                    let dy=
                        touch.clientY-
                        lastY;

                    rotationY-=
                        dx*.004;

                    rotationX-=
                        dy*.004;

                    rotationX=
                        clamp(
                            rotationX,
                            -1.3,
                            1.3
                        );

                    player.rotation.y=
                        rotationY;

                    camera.rotation.x=
                        rotationX;

                    lastX=
                        touch.clientX;

                    lastY=
                        touch.clientY;

                }

            }

        },
        {
            passive:true
        }
    );

    function resetAim(e){

        for(
            let touch of
            e.changedTouches
        ){

            if(
                touch.identifier===
                aimTouch
            ){

                aimTouch=null;

            }

        }

    }

    renderer.domElement.addEventListener(
        "touchend",
        resetAim
    );

    renderer.domElement.addEventListener(
        "touchcancel",
        resetAim
    );

    /* FIRE */

    let fireButton=
        el("fire");

    onTouchStart(
        fireButton,
        function(){

            isFiring=true;

            shoot();

        }
    );

    fireButton.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            isFiring=false;

        },
        {
            passive:false
        }
    );

    fireButton.addEventListener(
        "touchcancel",
        function(){

            isFiring=false;

        }
    );

    /* ADS */

    onTouchStart(
        el("ads"),
        toggleADS
    );

    /* RELOAD */

    onTouchStart(
        el("reload"),
        reload
    );

    /* WEAPONS */

    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(
            button=>{

                onTouchStart(
                    button,
                    function(){

                        switchWeapon(
                            button.dataset.weapon
                        );

                    }
                );

            }
        );

    /* RESTART */

    el("restart").addEventListener(
        "click",
        function(){

            location.reload();

        }
    );

}

/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer(delta){

    if(gameOver)return;

    let speed=8;

    let forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    let right=
        new THREE.Vector3(
            1,
            0,
            0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    forward.y=0;
    right.y=0;

    forward.normalize();
    right.normalize();

    let movement=
        new THREE.Vector3();

    movement.add(
        forward.multiplyScalar(
            -joyY
        )
    );

    movement.add(
        right.multiplyScalar(
            joyX
        )
    );

    if(
        movement.length()>0
    ){

        movement.normalize();

        movement.multiplyScalar(
            speed*delta
        );

        moveWithCollision(
            player,
            movement,
            PLAYER_RADIUS
        );

    }

    player.position.x=
        clamp(
            player.position.x,
            -120,
            120
        );

    player.position.z=
        clamp(
            player.position.z,
            -120,
            120
        );

}

/* =====================================================
   SHOOTING
===================================================== */

function shoot(){

    if(gameOver)return;

    const weapon=
        weapons[currentWeapon];

    const now=
        performance.now();

    /*
       SNIPER MUST BE SCOPED TO FIRE
       AND ALWAYS FIRES ONE SHOT.
    */

    if(
        !GameCore.canFire(
            weapon,
            currentWeapon,
            now,
            lastPlayerShot,
            isADS
        )
    ){

        if(
            weapon.ammo<=0&&
            now-lastPlayerShot>=
                weapon.fireRate
        ){

            reload();

        }

        return;

    }

    lastPlayerShot=now;

    weapon.ammo--;

    fireGunAnimation();

    updateWeaponHUD();

    const direction=
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.normalize();

    /*
       SNIPER HAS ZERO SPREAD.
       OTHER WEAPONS USE SPREAD.
    */

    applySpread(
        direction,
        weapon.spread
    );

    const start=
        new THREE.Vector3();

    camera.getWorldPosition(
        start
    );

    createProjectile(
        start,
        direction,
        true,
        weapon.damage,
        weapon.projectileSpeed,
        weapon.projectileLife
    );

}

/* =====================================================
   PROJECTILE
===================================================== */

function createProjectile(
    start,
    direction,
    friendly,
    damage,
    speed,
    life
){

    const geometry=
        new THREE.SphereGeometry(
            friendly?.1:.15,
            6,
            6
        );

    const material=
        new THREE.MeshBasicMaterial({
            color:
                friendly?
                0xffff00:
                0xff0000
        });

    const bullet=
        new THREE.Mesh(
            geometry,
            material
        );

    bullet.position.copy(
        start
    );

    bullet.userData={

        direction:
            direction.clone()
                .normalize(),

        speed:speed,

        damage:damage,

        friendly:friendly,

        life:life,

        age:0

    };

    scene.add(
        bullet
    );

    projectiles.push(
        bullet
    );

}

/* =====================================================
   UPDATE PROJECTILES
===================================================== */

function updateProjectiles(delta){

    if(
        !projectiles||
        projectiles.length===0
    ){

        return;

    }

    for(
        let i=
            projectiles.length-1;
        i>=0;
        i--
    ){

        const projectile=
            projectiles[i];

        if(!projectile){

            projectiles.splice(
                i,
                1
            );

            continue;

        }

        const data=
            projectile.userData;

        if(!data){

            removeProjectile(i);

            continue;

        }

        const oldPosition=
            projectile.position.clone();

        const movement=
            data.direction
                .clone()
                .multiplyScalar(
                    data.speed*
                    delta
                );

        projectile.position.add(
            movement
        );

        data.age+=delta;

        if(
            data.age>=data.life
        ){

            removeProjectile(i);

            continue;

        }

        const travel=
            projectile.position
                .clone()
                .sub(
                    oldPosition
                );

        const distance=
            travel.length();

        if(distance<=0)continue;

        travel.normalize();

        const ray=
            new THREE.Raycaster(
                oldPosition,
                travel,
                0,
                distance
            );

        const wallHits=
            ray.intersectObjects(
                walls,
                false
            );

        if(
            wallHits.length>0
        ){

            createHitEffect(
                wallHits[0].point
            );

            removeProjectile(i);

            continue;

        }

        if(data.friendly){

            const hit=
                checkBulletEnemyHit(
                    ray,
                    data.damage
                );

            if(hit){

                removeProjectile(i);

                continue;

            }

        }

        else{

            const hit=
                checkBulletPlayerHit(
                    ray
                );

            if(hit){

                removeProjectile(i);

                continue;

            }

        }

    }

}

/* =====================================================
   BULLET ENEMY HIT
===================================================== */

function checkBulletEnemyHit(
    ray,
    damage
){

    if(!enemies)return false;

    for(
        let i=0;
        i<enemies.length;
        i++
    ){

        const enemy=
            enemies[i];

        if(
            !enemy||
            !enemy.alive
        )continue;

        const meshes=[];

        enemy.traverse(
            function(object){

                if(object.isMesh){

                    meshes.push(
                        object
                    );

                }

            }
        );

        const hits=
            ray.intersectObjects(
                meshes,
                false
            );

        if(
            hits.length===0
        )continue;

        const hit=
            hits[0];

        showHitMarker();

        enemy.health-=
            damage;

        createHitEffect(
            hit.point
        );

        if(
            enemy.health<=0
        ){

            killEnemy(
                enemy
            );

        }

        else{

            score+=10;

            showScorePopup(
                "+10"
            );

            updateHUD();

        }

        return true;

    }

    return false;

}

/* =====================================================
   PLAYER HIT
===================================================== */

function checkBulletPlayerHit(
    ray
){

    if(!player)return false;

    const playerPosition=
        player.position.clone();

    const playerRadius=
        1.2;

    const toPlayer=
        playerPosition
            .clone()
            .sub(
                ray.ray.origin
            );

    const distanceAlongRay=
        toPlayer.dot(
            ray.ray.direction
        );

    if(
        distanceAlongRay<0||
        distanceAlongRay>ray.far
    ){

        return false;

    }

    const closestPoint=
        ray.ray.origin
            .clone()
            .add(
                ray.ray.direction
                    .clone()
                    .multiplyScalar(
                        distanceAlongRay
                    )
            );

    const distance=
        closestPoint.distanceTo(
            playerPosition
        );

    if(
        distance<=playerRadius
    ){

        takeDamage(5);

        return true;

    }

    return false;

}

/* =====================================================
   HIT EFFECT
===================================================== */

function createHitEffect(
    position
){

    if(!scene)return;

    const geometry=
        new THREE.SphereGeometry(
            .15,
            6,
            6
        );

    const material=
        new THREE.MeshBasicMaterial({
            color:0xffff00,
            transparent:true,
            opacity:1
        });

    const effect=
        new THREE.Mesh(
            geometry,
            material
        );

    effect.position.copy(
        position
    );

    scene.add(effect);

    const startTime=
        performance.now();

    function animateHitEffect(){

        if(!effect.parent)return;

        const elapsed=
            performance.now()-
            startTime;

        const progress=
            elapsed/150;

        if(
            progress>=1
        ){

            scene.remove(
                effect
            );

            geometry.dispose();

            material.dispose();

            return;

        }

        effect.scale.setScalar(
            1+
            progress*3
        );

        material.opacity=
            1-progress;

        requestAnimationFrame(
            animateHitEffect
        );

    }

    animateHitEffect();

}

/* =====================================================
   REMOVE PROJECTILE
===================================================== */

function removeProjectile(
    index
){

    if(
        !projectiles||
        index<0||
        index>=projectiles.length
    ){

        return;

    }

    const projectile=
        projectiles[index];

    if(projectile){

        if(
            projectile.parent
        ){

            projectile.parent.remove(
                projectile
            );

        }

        if(
            projectile.geometry
        ){

            projectile.geometry.dispose();

        }

        if(
            projectile.material
        ){

            projectile.material.dispose();

        }

    }

    projectiles.splice(
        index,
        1
    );

}

/* =====================================================
   RELOAD
===================================================== */

function reload(){

    const amount=
        GameCore.reloadWeapon(
            weapons[currentWeapon]
        );

    if(amount>0){

        updateWeaponHUD();

    }

}

/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(
    delta
){

    if(gameOver)return;

    for(
        let enemy of enemies
    ){

        if(!enemy.alive)continue;

        let direction=
            new THREE.Vector3();

        direction.subVectors(
            player.position,
            enemy.position
        );

        direction.y=0;

        let distance=
            direction.length();

        if(
            distance>
            enemy.detectionRange
        ){

            continue;

        }

        enemy.lookAt(
            player.position.x,
            enemy.position.y,
            player.position.z
        );

        if(
            distance>18
        ){

            direction.normalize();

            let movement=
                direction.clone()
                    .multiplyScalar(
                        enemy.moveSpeed*
                        delta
                    );

            let oldPosition=
                enemy.position.clone();

            moveWithCollision(
                enemy,
                movement,
                ENEMY_RADIUS
            );

            if(
                enemy.position.distanceTo(
                    oldPosition
                )<.001
            ){

                let slideX=
                    new THREE.Vector3(
                        movement.x,
                        0,
                        0
                    );

                let slideZ=
                    new THREE.Vector3(
                        0,
                        0,
                        movement.z
                    );

                moveWithCollision(
                    enemy,
                    slideX,
                    ENEMY_RADIUS
                );

                moveWithCollision(
                    enemy,
                    slideZ,
                    ENEMY_RADIUS
                );

            }

            enemy.walkTime+=
                delta*8;

            enemy.leftLeg.rotation.x=
                Math.sin(
                    enemy.walkTime
                )*.5;

            enemy.rightLeg.rotation.x=
                Math.sin(
                    enemy.walkTime+
                    Math.PI
                )*.5;

        }

        enemy.shootTimer-=
            delta;

        if(
            distance<
            enemy.attackRange&&
            enemy.shootTimer<=0
        ){

            enemy.shootTimer=
                randomRange(1.5,3);

            enemyShoot(
                enemy
            );

        }

    }

}

/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(
    enemy
){

    if(gameOver)return;

    let start=
        enemy.position.clone();

    start.y+=2;

    let target=
        player.position.clone();

    target.y-=.3;

    let direction=
        new THREE.Vector3();

    direction.subVectors(
        target,
        start
    );

    direction.normalize();

    applySpread(
        direction,
        .035
    );

    let raycaster=
        new THREE.Raycaster(
            start,
            direction
        );

    raycaster.far=150;

    let wallHits=
        raycaster.intersectObjects(
            walls,
            false
        );

    let playerDistance=
        start.distanceTo(
            target
        );

    if(
        wallHits.length>0&&
        wallHits[0].distance<
        playerDistance
    ){

        return;

    }

    createProjectile(
        start,
        direction,
        false,
        5,
        35,
        5
    );

}

/* =====================================================
   DAMAGE
===================================================== */

function takeDamage(
    damage
){

    if(gameOver)return;

    health=
        GameCore.applyDamage(
            health,
            damage
        );

    updateHUD();

    flashElement(
        "damageFlash",
        120
    );

    if(
        health<=0
    ){

        loseGame();

    }

}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    setText(
        "scoreDisplay",
        score
    );

    setText(
        "kills",
        kills
    );

    setText(
        "enemyCount",
        aliveEnemyCount()
    );

    el("health").style.width=
        health+
        "%";

    updateWeaponHUD();

    updateAirdropHUD();

}

/* WAVE */

function updateWaveHUD(){

    setText(
        "wave",
        currentWave
    );

}

/* =====================================================
   HIT MARKER
===================================================== */

function showHitMarker(){

    flashElement(
        "hitMarker",
        100
    );

}

/* =====================================================
   GAME OVER
===================================================== */

function loseGame(){

    if(gameOver)return;

    gameOver=true;

    isFiring=false;

    setText(
        "messageText",
        "GAME OVER"
    );

    setText(
        "finalScore",
        "FINAL SCORE: "+
        score
    );

    setDisplay(
        "message",
        true
    );

}

/* =====================================================
   RESIZE
===================================================== */

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    let now=
        performance.now();

    let delta=
        (
            now-
            lastTime
        )/
        1000;

    lastTime=now;

    delta=
        Math.min(
            delta,
            .1
        );

    /*
       AUTOMATIC WEAPONS
       SNIPER IS NOT AUTOMATIC.
       It fires exactly once per press.
    */

    if(
        isFiring&&
        weapons[currentWeapon]
            .automatic
    ){

        shoot();

    }

    movePlayer(
        delta
    );

    updateEnemies(
        delta
    );

    updateProjectiles(
        delta
    );

    updateWaveSystem(
        delta
    );

    updateAirdrops(
        delta
    );

    updateGun(
        delta
    );

    updateHUD();

    renderer.render(
        scene,
        camera
    );

}

/* =====================================================
   START GAME
===================================================== */

startGame();

</script>
