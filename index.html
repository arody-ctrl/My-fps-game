// =====================================================
// WALL
// =====================================================

function createWall(

    x,

    z,

    width,

    depth,

    height = 4

) {


    let geometry =

        new THREE.BoxGeometry(

            width,

            height,

            depth

        );


    let material =

        new THREE.MeshStandardMaterial({

            color: 0x777777,

            roughness: 0.8

        });


    let wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        height / 2,

        z

    );


    // Store collision dimensions

    wall.userData.halfWidth =

        width / 2;


    wall.userData.halfDepth =

        depth / 2;


    scene.add(wall);

    walls.push(wall);


    return wall;

}

// =====================================================
// WALL COLLISION
// =====================================================

function circleIntersectsWall(

    x,

    z,

    radius

) {


    for (

        let wall of walls

    ) {


        let halfWidth =

            wall.userData.halfWidth;


        let halfDepth =

            wall.userData.halfDepth;


        let closestX =

            Math.max(

                wall.position.x -

                halfWidth,

                Math.min(

                    x,

                    wall.position.x +

                    halfWidth

                )

            );


        let closestZ =

            Math.max(

                wall.position.z -

                halfDepth,

                Math.min(

                    z,

                    wall.position.z +

                    halfDepth

                )

            );


        let dx =

            x -

            closestX;


        let dz =

            z -

            closestZ;


        if (

            dx * dx +

            dz * dz <

            radius * radius

        ) {


            return true;

        }

    }


    return false;

}


// =====================================================
// MOVE WITH COLLISION
// =====================================================

function moveWithCollision(

    object,

    movement,

    radius

) {


    let newX =

        object.position.x +

        movement.x;


    let newZ =

        object.position.z;


    if (

        !circleIntersectsWall(

            newX,

            newZ,

            radius

        )

    ) {


        object.position.x =

            newX;

    }


    newX =

        object.position.x;


    newZ =

        object.position.z +

        movement.z;


    if (

        !circleIntersectsWall(

            newX,

            newZ,

            radius

        )

    ) {


        object.position.z =

            newZ;

    }

}


// =====================================================
// WAVE SYSTEM
// =====================================================

function startWave() {


    if (gameOver)

        return;


    if (waveStarting)

        return;


    waveStarting = true;


    currentWave++;


    waveInProgress = true;


    waveEnemiesRemaining =

        5 +

        (

            currentWave - 1

        ) * 2;


    waveSpawnTimer = 0;


    updateWaveHUD();


    setTimeout(

        function() {

            waveStarting = false;

        },

        500

    );

}


// =====================================================
// WAVE UPDATE
// =====================================================

function updateWaveSystem(

    delta

) {


    if (gameOver)

        return;


    if (!waveInProgress)

        return;


    let activeEnemies =

        enemies.filter(

            enemy => enemy.alive

        ).length;


    if (

        waveEnemiesRemaining > 0 &&

        activeEnemies <

        MAX_ACTIVE_ENEMIES

    ) {


        waveSpawnTimer -= delta;


        if (

            waveSpawnTimer <= 0

        ) {


            spawnWaveEnemy();


            waveEnemiesRemaining--;


            waveSpawnTimer =

                0.7;

        }

    }


    let aliveEnemies =

        enemies.filter(

            enemy => enemy.alive

        ).length;


    if (

        waveEnemiesRemaining <= 0 &&

        aliveEnemies === 0

    ) {


        waveInProgress = false;


        setTimeout(

            function() {


                if (!gameOver) {

                    startWave();

                }


            },

            3000

        );

    }

}


// =====================================================
// SPAWN ENEMY
// =====================================================

function spawnWaveEnemy() {


    if (gameOver)

        return;


    let attempts = 0;

    let x = 0;

    let z = 0;


    while (

        attempts < 30

    ) {


        let spawn =

            spawnPoints[

                Math.floor(

                    Math.random() *

                    spawnPoints.length

                )

            ];


        x = spawn[0];

        z = spawn[1];


        let distance =

            Math.hypot(

                x -

                player.position.x,

                z -

                player.position.z

            );


        if (

            distance >= 40 &&

            !circleIntersectsWall(

                x,

                z,

                ENEMY_RADIUS

            )

        ) {


            break;

        }


        attempts++;

    }


    createEnemy(

        x,

        z

    );

}

// =====================================================

// =====================================================

function setupControls() {


    let joystick =

        document.getElementById(

            "joystick"

        );


    let stick =

        document.getElementById(

            "stick"

        );


    // JOYSTICK START

    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            if (

                joystickTouch !== null

            )

                return;


            joystickTouch =

                e.changedTouches[0]

                .identifier;

        },

        {

            passive: false

        }

    );


    // JOYSTICK MOVE

    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            if (

                joystickTouch === null

            )

                return;


            let touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===

                    joystickTouch

                );


            if (!touch)

                return;


            let rect =

                joystick.getBoundingClientRect();


            let x =

                touch.clientX -

                (

                    rect.left +

                    rect.width / 2

                );


            let y =

                touch.clientY -

                (

                    rect.top +

                    rect.height / 2

                );


            let max = 40;


            let distance =

                Math.hypot(

                    x,

                    y

                );


            if (

                distance > max

            ) {


                x =

                    x /

                    distance *

                    max;


                y =

                    y /

                    distance *

                    max;

            }


            joyX = x / max;

            joyY = y / max;


            stick.style.transform =

                "translate(" +

                x +

                "px, " +

                y +

                "px)";

        },

        {

            passive: false

        }

    );


    // JOYSTICK END

    function resetJoystick() {


        joystickTouch = null;

        joyX = 0;

        joyY = 0;


        stick.style.transform =

            "translate(0px,0px)";

        "touchend",

        resetJoystick

        "touchcancel",

        resetJoystick

                e.changedTouches

                    touch.clientX >

                    window.innerWidth / 2

                ) {

                        aimTouch === null

                    ) {


                        aimTouch =

                            touch.identifier;


                        lastX =

                            touch.clientX;


                        lastY =

                            touch.clientY;

                    }

                }

            }

        },

        {

            passive: true

        }

    );


    // AIM MOVE

        "touchmove",

        function(e) {


            for (

                let touch of

                e.changedTouches

                    touch.identifier ===

                    aimTouch

                        lastX;

                        touch.clientY -

                        lastY;

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        },

        {

            passive: true

        }

    );


    // AIM END

    function resetAim(e) {


        for (

            let touch of

            e.changedTouches

        ) {


            if (

                touch.identifier ===

                aimTouch

            ) {


                aimTouch = null;

            }

        }

    }


    renderer.domElement.addEventListener(

        "touchend",

        resetAim

    );


    renderer.domElement.addEventListener(

        "touchcancel",

        resetAim

    );

    document

        .getElementById(

            "fire"

        )

            "touchstart",

            function(e) {


                e.preventDefault();


                shoot();

            },

                passive: false

            }

        );

        .getElementById(

            "reload"

        )

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            {

                passive: false

            }

        );


    // SPECIAL

    document

        .getElementById(

            "special"

        )

        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                activateSpecial();

            },

            {

                passive: false

            }

        );


    // RESTART

    document

        .getElementById(

            "restart"

        )

        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// =====================================================
// PLAYER MOVEMENT
// =====================================================

function movePlayer(

    delta

) {


    if (gameOver)

        return;


    let speed = 8;


    let forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    let right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        movement.multiplyScalar(

            speed * delta

        );


        moveWithCollision(

            player,

            movement,

            PLAYER_RADIUS

        );

    }


    player.position.x =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -120,

            Math.min(

                120,

                player.position.z

            )

        );

}


// =====================================================
// PLAYER SHOOTING
// =====================================================

function shoot() {


    if (gameOver)

        return;


    let now =

        performance.now();


    if (

        now -

        lastPlayerShot <

        playerFireRate

    )

        return;


    if (

        ammo <= 0

    ) {


        reload();


        return;

    }


    lastPlayerShot = now;


    ammo--;


    updateHUD();


    let direction =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    direction.applyQuaternion(

        camera.getWorldQuaternion(

            new THREE.Quaternion()

        )

    );


    let start =

        camera.getWorldPosition(

            new THREE.Vector3()

        );


    createProjectile(

        start,

        direction,

        true

    );

}


// =====================================================
// CREATE PROJECTILE
// =====================================================

function createProjectile(

    start,

    direction,

    playerProjectile

) {


    let geometry =

        new THREE.SphereGeometry(

            0.18,

            8,

            8

        );


    let material =

        new THREE.MeshBasicMaterial({

            color:

                playerProjectile

                ? 0xffff00

                : 0xff0000

        });


    let projectile =

        new THREE.Mesh(

            geometry,

            material

        );


    projectile.position.copy(

        start

    );


    projectile.direction =

        direction.clone().normalize();


    projectile.speed =

        playerProjectile

        ? 70

        : 35;


    projectile.life =

        playerProjectile

        ? 4

        : 3;


    projectile.playerProjectile =

        playerProjectile;


    scene.add(projectile);


    projectiles.push(

        projectile

    );

}


// =====================================================
// PROJECTILE UPDATE
// =====================================================

function updateProjectiles(

    delta

) {


    for (

        let i =

        projectiles.length - 1;

        i >= 0;

        i--

    ) {


        let projectile =

            projectiles[i];


        projectile.life -=

            delta;


        let movement =

            projectile.direction.clone()

            .multiplyScalar(

                projectile.speed *

                delta

            );


        let oldPosition =

            projectile.position.clone();


        projectile.position.add(

            movement

        );


        // WALL COLLISION

        if (

            circleIntersectsWall(

                projectile.position.x,

                projectile.position.z,

                0.1

            )

        ) {


            removeProjectile(i);

            continue;

        }


        // RANGE / LIFE

        if (

            projectile.life <= 0

        ) {


            removeProjectile(i);

            continue;

        }


        // PLAYER PROJECTILE

        if (

            projectile.playerProjectile

        ) {


            let aliveEnemies =

                enemies.filter(

                    e => e.alive

                );


            for (

                let enemy of

                aliveEnemies

            ) {


                let distance =

                    projectile.position.distanceTo(

                        enemy.position

                    );


                if (

                    distance < 3

                ) {


                    enemy.health -= 25;


                    showHitMarker();


                    if (

                        enemy.health <= 0

                    ) {


                        killEnemy(

                            enemy

                        );

                    }


                    removeProjectile(i);

                    break;

                }

            }

        }


        // ENEMY PROJECTILE

        else {


            let distance =

                projectile.position.distanceTo(

                    player.position

                );


            if (

                distance < 2

            ) {


                takeDamage(5);


                removeProjectile(i);

            }

        }

    }

}


// =====================================================
// REMOVE PROJECTILE
// =====================================================

function removeProjectile(

    index

) {


    let projectile =

        projectiles[index];


    scene.remove(

        projectile

    );


    projectiles.splice(

        index,

        1

    );

}


// =====================================================
// HIT MARKER
// =====================================================

function showHitMarker() {


    let marker =

        document.getElementById(

            "hitMarker"

        );


    marker.style.opacity = 1;


    setTimeout(

        function() {


            marker.style.opacity = 0;


        },

        100

    );

}


// =====================================================
// RELOAD
// =====================================================

function reload() {


    let needed =

        30 -

        ammo;


    if (

        needed <= 0 ||

        reserve <= 0

    )

        return;


    let amount =

        Math.min(

            needed,

            reserve

        );


    ammo += amount;

    reserve -= amount;


    updateHUD();

}


// =====================================================
// ENEMY AI
// =====================================================

function updateEnemies(

    delta

) {


    if (gameOver)

        return;


    for (

        let enemy of

        enemies

    ) {


        if (!enemy.alive)

            continue;


        let direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y = 0;


        let distance =

            direction.length();


        if (

            distance >

            enemy.detectionRange

        )

            continue;


        enemy.lookAt(

            player.position.x,

            enemy.position.y,

            player.position.z

        );


        // MOVEMENT

        if (

            distance > 18

        ) {


            direction.normalize();


            let movement =

                direction.clone()

                .multiplyScalar(

                    enemy.moveSpeed *

                    delta

                );


            // Try direct movement

            let oldPosition =

                enemy.position.clone();


            moveWithCollision(

                enemy,

                movement,

                ENEMY_RADIUS

            );


            // If blocked, try sliding

            if (

                enemy.position.distanceTo(

                    oldPosition

                ) < 0.001

            ) {


                let slideX =

                    new THREE.Vector3(

                        movement.x,

                        0,

                        0

                    );


                let slideZ =

                    new THREE.Vector3(

                        0,

                        0,

                        movement.z

                    );


                moveWithCollision(

                    enemy,

                    slideX,

                    ENEMY_RADIUS

                );


                moveWithCollision(

                    enemy,

                    slideZ,

                    ENEMY_RADIUS

                );

            }


            enemy.walkTime +=

                delta * 8;


            enemy.leftLeg.rotation.x =

                Math.sin(

                    enemy.walkTime

                ) * 0.5;


            enemy.rightLeg.rotation.x =

                Math.sin(

                    enemy.walkTime +

                    Math.PI

                ) * 0.5;

        }


        // ATTACK

        enemy.shootTimer -=

            delta;


        if (

            distance <

            enemy.attackRange &&

            enemy.shootTimer <= 0

        ) {


            enemy.shootTimer =

                1.5 +

                Math.random() *

                1.5;


            enemyShoot(

                enemy

            );

        }

    }

}


// =====================================================
// ENEMY SHOOT
// =====================================================

function enemyShoot(

    enemy

) {


    if (gameOver)

        return;


    let start =

        enemy.position.clone();


    start.y += 2;


    let target =

        player.position.clone();


    target.y -= 0.3;


    let direction =

        new THREE.Vector3();


    direction.subVectors(

        target,

        start

    );


    direction.normalize();


    direction.x +=

        (

            Math.random() -

            0.5

        ) * 0.035;


    direction.y +=

        (

            Math.random() -

            0.5

        ) * 0.035;


    direction.z +=

        (

            Math.random() -

            0.5

        ) * 0.035;


    direction.normalize();


    // Check wall blocking

    let raycaster =

        new THREE.Raycaster(

            start,

            direction

        );


    raycaster.far =

        70;


    let wallHits =

        raycaster.intersectObjects(

            walls,

            false

        );


    let playerDistance =

        start.distanceTo(

            target

        );


    if (

        wallHits.length > 0 &&

        wallHits[0].distance <

        playerDistance

    ) {


        return;

    }


    createProjectile(

        start,

        direction,

        false

    );

}


// =====================================================
// DAMAGE
// =====================================================

function takeDamage(

    damage

) {


    if (gameOver)

        return;


    health -= damage;


    health = Math.max(

        0,

        health

    );


    updateHUD();


    let flash =

        document.getElementById(

            "damageFlash"

        );


    flash.style.opacity = 1;


    setTimeout(

        function() {


            flash.style.opacity = 0;


        },

        120

    );


    if (

        health <= 0

    ) {


        loseGame();

    }

}

        "wave"

    ).textContent =

// =====================================================
// WIN / LOSE
// =====================================================

function winGame() {

}

// =====================================================
// RESIZE
// =====================================================

function resize() {


    camera.aspect =

        window.innerWidth /

        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// =====================================================
// GAME LOOP
// =====================================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    let now =

        performance.now();


    let delta =

        (

            now -

            lastTime

        ) / 1000;


    lastTime = now;


    delta = Math.min(

        delta,

        0.1

    );


    // SPECIAL COOLDOWN

    if (

        specialCooldown > 0

    ) {


        specialCooldown -=

            delta;


        if (

            specialCooldown < 0

        ) {


            specialCooldown = 0;

        }


        updateSpecialButton();

    }


    movePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    updateProjectiles(

        delta

    );


    updateWaveSystem(

        delta

    );


    updateHUD();


    renderer.render(

        scene,

        camera

    );

}


// =====================================================
// START
// =====================================================

startGame();
