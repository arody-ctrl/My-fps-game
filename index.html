<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile FPS</title>

<style>

html, body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    background: #87CEEB;

    touch-action: none;

    font-family: Arial, sans-serif;

}

canvas {

    display: block;

}


/* HUD */

#hud {

    position: fixed;

    top: 15px;
    left: 15px;

    color: white;

    font-size: 18px;

    font-weight: bold;

    text-shadow: 2px 2px 4px black;

    z-index: 10;

}

#healthBar {

    width: 180px;

    height: 20px;

    background: #333;

    border: 2px solid white;

}

#health {

    width: 100%;

    height: 100%;

    background: lime;

}


/* Crosshair */

#crosshair {

    position: fixed;

    top: 50%;
    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 30px;

    font-weight: bold;

    text-shadow: 2px 2px 5px black;

    pointer-events: none;

    z-index: 5;

}


/* Joystick */

#joystick {

    position: fixed;

    left: 25px;

    bottom: 30px;

    width: 130px;

    height: 130px;

    border-radius: 50%;

    background: rgba(255,255,255,0.2);

    border: 3px solid rgba(255,255,255,0.5);

    z-index: 20;

}

#stick {

    position: absolute;

    width: 50px;

    height: 50px;

    left: 40px;

    top: 40px;

    border-radius: 50%;

    background: rgba(255,255,255,0.7);

}


/* Fire */

#fire {

    position: fixed;

    right: 25px;

    bottom: 35px;

    width: 90px;

    height: 90px;

    border-radius: 50%;

    background: red;

    color: white;

    border: 3px solid white;

    font-weight: bold;

    font-size: 18px;

    z-index: 20;

}


/* Reload */

#reload {

    position: fixed;

    right: 35px;

    bottom: 145px;

    width: 80px;

    height: 45px;

    background: black;

    color: white;

    border: 2px solid white;

    border-radius: 8px;

    z-index: 20;

}


/* Game message */

#message {

    position: fixed;

    top: 50%;

    left: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-size: 35px;

    font-weight: bold;

    text-align: center;

    text-shadow: 3px 3px 5px black;

    z-index: 100;

    display: none;

}

#restart {

    margin-top: 20px;

    padding: 12px 25px;

    background: black;

    color: white;

    border: 2px solid white;

    border-radius: 8px;

    font-size: 18px;

}

</style>

</head>


<body>


<div id="hud">

HEALTH

<div id="healthBar">

<div id="health"></div>

</div>

<div>

AMMO:

<span id="ammo">
30
</span>

/

<span id="reserve">
120
</span>

</div>

<div>

KILLS:

<span id="kills">
0
</span>

</div>

</div>


<div id="crosshair">

+

</div>


<div id="joystick">

<div id="stick">

</div>

</div>


<button id="fire">

FIRE

</button>


<button id="reload">

RELOAD

</button>


<div id="message">

<div id="messageText">

GAME OVER

</div>

<button id="restart">

RESTART

</button>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>


<script>


// ==========================================
// GAME VARIABLES
// ==========================================

let scene;

let camera;

let renderer;

let player;

let enemies = [];

let health = 100;

let ammo = 30;

let reserve = 120;

let kills = 0;

let gameOver = false;


// Joystick

let joyX = 0;

let joyY = 0;

let joystickTouch = null;


// Aim

let aimTouch = null;

let lastX = 0;

let lastY = 0;

let rotationY = 0;

let rotationX = 0;


// ==========================================
// START GAME
// ==========================================

function startGame() {


    scene = new THREE.Scene();


    scene.background =

        new THREE.Color(
            0x87CEEB
        );


    camera =

        new THREE.PerspectiveCamera(

            75,

            window.innerWidth /
            window.innerHeight,

            0.1,

            1000

        );


    renderer =

        new THREE.WebGLRenderer({

            antialias: true

        });


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );


    document.body.appendChild(

        renderer.domElement

    );


    // Lighting

    let light =

        new THREE.HemisphereLight(

            0xffffff,

            0x444444,

            2

        );


    scene.add(light);


    // Player

    player =

        new THREE.Object3D();


    player.position.set(

        0,

        2,

        10

    );


    scene.add(player);


    player.add(camera);


    // Ground

    createGround();


    // Walls

    createWall(

        0,

        -25,

        50,

        1

    );


    createWall(

        0,

        25,

        50,

        1

    );


    createWall(

        -25,

        0,

        1,

        50

    );


    createWall(

        25,

        0,

        1,

        50

    );


    // Enemies

    createEnemy(

        -10,

        -10

    );


    createEnemy(

        10,

        -10

    );


    createEnemy(

        -10,

        5

    );


    createEnemy(

        10,

        5

    );


    createEnemy(

        0,

        -15

    );


    setupControls();


    window.addEventListener(

        "resize",

        resize

    );


    animate();

}


// ==========================================
// GROUND
// ==========================================

function createGround() {


    let geometry =

        new THREE.PlaneGeometry(

            100,

            100

        );


    let material =

        new THREE.MeshBasicMaterial({

            color: 0x228B22

        });


    let ground =

        new THREE.Mesh(

            geometry,

            material

        );


    ground.rotation.x =

        -Math.PI / 2;


    scene.add(ground);

}


// ==========================================
// WALLS
// ==========================================

function createWall(

    x,

    z,

    width,

    depth

) {


    let geometry =

        new THREE.BoxGeometry(

            width,

            4,

            depth

        );


    let material =

        new THREE.MeshBasicMaterial({

            color: 0x777777

        });


    let wall =

        new THREE.Mesh(

            geometry,

            material

        );


    wall.position.set(

        x,

        2,

        z

    );


    scene.add(wall);

}


// ==========================================
// ENEMY
// ==========================================

function createEnemy(

    x,

    z

) {


    let geometry =

        new THREE.BoxGeometry(

            1.5,

            2,

            1.5

        );


    let material =

        new THREE.MeshBasicMaterial({

            color: 0xff0000

        });


    let enemy =

        new THREE.Mesh(

            geometry,

            material

        );


    enemy.position.set(

        x,

        1,

        z

    );


    enemy.health = 100;

    enemy.alive = true;


    scene.add(enemy);


    enemies.push(enemy);

}


// ==========================================
// CONTROLS
// ==========================================

function setupControls() {


    let joystick =

        document.getElementById(

            "joystick"

        );


    let stick =

        document.getElementById(

            "stick"

        );


    // Joystick START

    joystick.addEventListener(

        "touchstart",

        function(e) {


            e.preventDefault();


            joystickTouch =

                e.changedTouches[0]
                .identifier;

        },

        {

            passive: false

        }

    );


    // Joystick MOVE

    joystick.addEventListener(

        "touchmove",

        function(e) {


            e.preventDefault();


            if (

                joystickTouch === null

            )
                return;


            let touch =

                [...e.touches].find(

                    t =>

                    t.identifier ===
                    joystickTouch

                );


            if (!touch)
                return;


            let rect =

                joystick.getBoundingClientRect();


            let centerX =

                rect.left +
                rect.width / 2;


            let centerY =

                rect.top +
                rect.height / 2;


            let x =

                touch.clientX -
                centerX;


            let y =

                touch.clientY -
                centerY;


            let max = 40;


            let distance =

                Math.sqrt(

                    x*x +
                    y*y

                );


            if (

                distance > max

            ) {


                x =

                    x /
                    distance *
                    max;


                y =

                    y /
                    distance *
                    max;

            }


            joyX =

                x / max;


            joyY =

                y / max;


            stick.style.transform =

                "translate(" +

                x +

                "px, " +

                y +

                "px)";

        },

        {

            passive: false

        }

    );


    // Joystick END

    joystick.addEventListener(

        "touchend",

        function() {


            joystickTouch = null;


            joyX = 0;

            joyY = 0;


            stick.style.transform =

                "translate(0px,0px)";

        }

    );


    // ==================================
    // AIMING
    // ==================================


    renderer.domElement.addEventListener(

        "touchstart",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.clientX >
                    window.innerWidth / 2

                ) {


                    aimTouch =

                        touch.identifier;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchmove",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    let dx =

                        touch.clientX -
                        lastX;


                    let dy =

                        touch.clientY -
                        lastY;


                    rotationY -=

                        dx * 0.004;


                    rotationX -=

                        dy * 0.004;


                    rotationX =

                        Math.max(

                            -1.3,

                            Math.min(

                                1.3,

                                rotationX

                            )

                        );


                    player.rotation.y =

                        rotationY;


                    camera.rotation.x =

                        rotationX;


                    lastX =

                        touch.clientX;


                    lastY =

                        touch.clientY;

                }

            }

        }

    );


    renderer.domElement.addEventListener(

        "touchend",

        function(e) {


            for (

                let touch of
                e.changedTouches

            ) {


                if (

                    touch.identifier ===
                    aimTouch

                ) {


                    aimTouch = null;

                }

            }

        }

    );


    // FIRE

    document
        .getElementById("fire")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                shoot();

            },

            {

                passive: false

            }

        );


    // RELOAD

    document
        .getElementById("reload")
        .addEventListener(

            "touchstart",

            function(e) {


                e.preventDefault();


                reload();

            },

            {

                passive: false

            }

        );


    // RESTART

    document
        .getElementById("restart")
        .addEventListener(

            "click",

            function() {


                location.reload();

            }

        );

}


// ==========================================
// PLAYER MOVEMENT
// ==========================================

function movePlayer(

    delta

) {


    if (gameOver)
        return;


    let speed = 6;


    let forward =

        new THREE.Vector3(

            0,

            0,

            -1

        );


    let right =

        new THREE.Vector3(

            1,

            0,

            0

        );


    forward.applyQuaternion(

        player.quaternion

    );


    right.applyQuaternion(

        player.quaternion

    );


    forward.y = 0;

    right.y = 0;


    forward.normalize();

    right.normalize();


    let movement =

        new THREE.Vector3();


    movement.add(

        forward.multiplyScalar(

            -joyY

        )

    );


    movement.add(

        right.multiplyScalar(

            joyX

        )

    );


    if (

        movement.length() > 0

    ) {


        movement.normalize();


        player.position.add(

            movement.multiplyScalar(

                speed *
                delta

            )

        );

    }


    // Map boundary

    player.position.x =

        Math.max(

            -23,

            Math.min(

                23,

                player.position.x

            )

        );


    player.position.z =

        Math.max(

            -23,

            Math.min(

                23,

                player.position.z

            )

        );

}


// ==========================================
// SHOOT
// ==========================================

function shoot() {


    if (

        gameOver

    )
        return;


    if (

        ammo <= 0

    ) {


        reload();


        return;

    }


    ammo--;


    updateHUD();


    let raycaster =

        new THREE.Raycaster();


    raycaster.setFromCamera(

        new THREE.Vector2(

            0,

            0

        ),

        camera

    );


    let aliveEnemies =

        enemies.filter(

            e => e.alive

        );


    let hits =

        raycaster.intersectObjects(

            aliveEnemies

        );


    if (

        hits.length > 0

    ) {


        let enemy =

            hits[0].object;


        enemy.health -= 25;


        if (

            enemy.health <= 0

        ) {


            enemy.alive = false;


            scene.remove(enemy);


            kills++;


            updateHUD();


            if (

                kills ===
                enemies.length

            ) {


                winGame();

            }

        }

    }

}


// ==========================================
// RELOAD
// ==========================================

function reload() {


    let needed =

        30 -
        ammo;


    if (

        needed <= 0 ||
        reserve <= 0

    )
        return;


    let amount =

        Math.min(

            needed,

            reserve

        );


    ammo += amount;

    reserve -= amount;


    updateHUD();

}


// ==========================================
// ENEMY AI
// ==========================================

function updateEnemies(

    delta

) {


    if (gameOver)
        return;


    for (

        let enemy of enemies

    ) {


        if (!enemy.alive)
            continue;


        let direction =

            new THREE.Vector3();


        direction.subVectors(

            player.position,

            enemy.position

        );


        direction.y = 0;


        let distance =

            direction.length();


        if (

            distance > 3

        ) {


            direction.normalize();


            enemy.position.add(

                direction.multiplyScalar(

                    delta * 1.2

                )

            );

        }

        else {


            health -=

                delta * 10;


            health =

                Math.max(

                    0,

                    health

                );


            updateHUD();


            if (

                health <= 0

            ) {


                loseGame();

            }

        }

    }

}


// ==========================================
// HUD
// ==========================================

function updateHUD() {


    document.getElementById(

        "ammo"

    ).textContent =

        ammo;


    document.getElementById(

        "reserve"

    ).textContent =

        reserve;


    document.getElementById(

        "kills"

    ).textContent =

        kills;


    document.getElementById(

        "health"

    ).style.width =

        health + "%";

}


// ==========================================
// WIN / LOSE
// ==========================================

function winGame() {


    gameOver = true;


    document.getElementById(

        "messageText"

    ).textContent =

        "YOU WIN!";


    document.getElementById(

        "message"

    ).style.display =

        "block";

}


function loseGame() {


    gameOver = true;


    document.getElementById(

        "messageText"

    ).textContent =

        "GAME OVER";


    document.getElementById(

        "message"

    ).style.display =

        "block";

}


// ==========================================
// RESIZE
// ==========================================

function resize() {


    camera.aspect =

        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,

        window.innerHeight

    );

}


// ==========================================
// GAME LOOP
// ==========================================

let lastTime =

    performance.now();


function animate() {


    requestAnimationFrame(

        animate

    );


    let now =

        performance.now();


    let delta =

        (now -
        lastTime) /
        1000;


    lastTime = now;


    delta =

        Math.min(

            delta,

            0.1

        );


    movePlayer(

        delta

    );


    updateEnemies(

        delta

    );


    renderer.render(

        scene,

        camera

    );

}


// ==========================================
// START
// ==========================================

startGame();


</script>

</body>

</html>
