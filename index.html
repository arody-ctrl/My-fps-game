<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Mobile FPS V6.5 - Airdrops + Sniper Edition</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87CEEB;
    touch-action:none;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100%;
    height:100%;
}

/* HUD */
#hud{
    position:fixed;
    top:15px;
    left:15px;
    color:white;
    font-size:17px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:10;
    user-select:none;
}

#healthBar{
    width:180px;
    height:20px;
    margin-top:4px;
    background:#333;
    border:2px solid white;
}

#health{
    width:100%;
    height:100%;
    background:lime;
    transition:width .2s;
}

.stat{margin-top:5px}

#scoreDisplay{
    color:gold;
    font-size:22px;
    margin-top:7px;
    text-shadow:2px 2px 4px black;
}

/* WEAPON HUD */
#weaponHUD{
    position:fixed;
    top:15px;
    right:15px;
    color:white;
    text-align:right;
    font-size:18px;
    font-weight:bold;
    text-shadow:2px 2px 4px black;
    z-index:10;
}

#weaponName{font-size:24px}
#adsStatus{font-size:14px;margin-top:4px}

/* CROSSHAIR */
#crosshair{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:25px;
    font-weight:bold;
    pointer-events:none;
    z-index:5;
}

/* SNIPER SCOPE */
#scopeOverlay{
    position:fixed;
    inset:0;
    display:none;
    pointer-events:none;
    z-index:4;
}

#scopeOverlay::before{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:min(85vw,85vh);
    transform:translate(-50%,-50%);
    border:8px solid rgba(0,0,0,.9);
    border-radius:50%;
    box-shadow:
        0 0 0 9999px rgba(0,0,0,.65),
        inset 0 0 30px black;
}

#scopeOverlay::after{
    content:"";
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:2px;
    transform:translate(-50%,-50%);
    background:rgba(255,255,255,.75);
    box-shadow:0 calc(min(85vw,85vh) / 2) 0 rgba(255,255,255,0);
}

#scopeCenter{
    position:absolute;
    left:50%;
    top:50%;
    width:min(85vw,85vh);
    height:min(85vw,85vh);
    transform:translate(-50%,-50%);
}

#scopeCenter::before{
    content:"";
    position:absolute;
    left:50%;
    top:0;
    width:2px;
    height:100%;
    background:rgba(255,255,255,.75);
}

#scopeCenter::after{
    content:"";
    position:absolute;
    left:0;
    top:50%;
    width:100%;
    height:2px;
    background:rgba(255,255,255,.75);
}

/* HIT */
#hitMarker{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    opacity:0;
    pointer-events:none;
    z-index:15;
}

/* SCORE */
#scorePopup{
    position:fixed;
    top:43%;
    left:50%;
    transform:translate(-50%,-50%);
    color:gold;
    font-size:26px;
    font-weight:bold;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:30;
}

/* DAMAGE */
#damageFlash{
    position:fixed;
    inset:0;
    background:rgba(255,0,0,.3);
    opacity:0;
    pointer-events:none;
    z-index:14;
}

/* AIRDROP MESSAGE */
#airdropMessage{
    position:fixed;
    top:25%;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:24px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:50;
    transition:opacity .2s;
}

/* AIRDROP INFO */
#airdropInfo{
    position:fixed;
    top:32%;
    left:50%;
    transform:translateX(-50%);
    color:#fff;
    font-size:17px;
    font-weight:bold;
    text-align:center;
    text-shadow:2px 2px 5px black;
    opacity:0;
    pointer-events:none;
    z-index:50;
}

/* JOYSTICK */
#joystick{
    position:fixed;
    left:25px;
    bottom:30px;
    width:130px;
    height:130px;
    border-radius:50%;
    background:rgba(255,255,255,.2);
    border:3px solid rgba(255,255,255,.5);
    z-index:20;
    touch-action:none;
}

#stick{
    position:absolute;
    width:50px;
    height:50px;
    left:40px;
    top:40px;
    border-radius:50%;
    background:rgba(255,255,255,.7);
    pointer-events:none;
}

/* FIRE */
#fire{
    position:fixed;
    right:25px;
    bottom:35px;
    width:90px;
    height:90px;
    border-radius:50%;
    background:red;
    color:white;
    border:3px solid white;
    font-weight:bold;
    font-size:18px;
    z-index:20;
    touch-action:none;
}

/* ADS */
#ads{
    position:fixed;
    right:130px;
    bottom:45px;
    width:80px;
    height:65px;
    border-radius:15px;
    background:#333;
    color:white;
    border:3px solid white;
    font-weight:bold;
    z-index:20;
    touch-action:none;
}

/* RELOAD */
#reload{
    position:fixed;
    right:35px;
    bottom:205px;
    width:80px;
    height:45px;
    background:black;
    color:white;
    border:2px solid white;
    border-radius:8px;

/* WEAPONS */
#weaponButtons{
    position:fixed;
    left:175px;
    bottom:25px;
    display:flex;
    gap:6px;
    z-index:20;
}

.weaponButton{

    height:48px;

    border:2px solid white;
    border-radius:8px;
    font-weight:bold;
    font-size:11px;
}

.weaponButton.active{

    color:black;
}

/* GAME MESSAGE */
#message{
    position:fixed;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    color:white;
    font-size:35px;
    font-weight:bold;
    text-align:center;
    text-shadow:3px 3px 5px black;
    z-index:100;
    display:none;
}

#finalScore{
    color:gold;
    font-size:25px;
    margin-top:10px;
}

#restart{

    padding:12px 25px;
    background:black;
    color:white;
    border:2px solid white;
    border-radius:8px;
    font-size:18px;
}
</style>
</head>

<script>

/* =====================================================
   CORE GAME
===================================================== */

let scene;
let camera;
let renderer;
let player;

let enemies = [];
let walls = [];
let projectiles = [];
let airdrops = [];

let health = 100;
let kills = 0;
let score = 0;

let gameOver = false;

/* =====================================================
   WEAPONS
===================================================== */

const weapons=GameCore.createWeapons();

let currentWeapon="AR";
let isADS=false;
let isFiring=false;
let lastPlayerShot=0;

/* =====================================================
   WEAPON UPGRADES
   MAX 4 UPGRADES PER WEAPON
===================================================== */

const MAX_UPGRADES=GameCore.MAX_UPGRADES;

const upgradeTypes=GameCore.upgradeTypes;

/* =====================================================
   LOW POLY GUN
===================================================== */

let gunModel;
let gunRecoil=0;
let gunBobTime=0;

function createGunModel(){

    if(gunModel){

        camera.remove(gunModel);

        gunModel.traverse(
            object=>{

                if(object.geometry){

                    object.geometry.dispose();

                }

                if(object.material){

                    object.material.dispose();

                }

            }
        );

    }

    gunModel=new THREE.Group();

    gunModel.position.set(
        .45,
        -.38,
        -.75
    );

    camera.add(gunModel);

    if(currentWeapon==="AR"){
        createARModel();
    }
    else if(currentWeapon==="SMG"){
        createSMGModel();
    }
    else if(currentWeapon==="PISTOL"){
        createPistolModel();
    }
    else if(currentWeapon==="SNIPER"){
        createSniperModel();
    }

}

function gunMaterial(color){

    return new THREE.MeshStandardMaterial({
        color:color,
        roughness:.7,
        metalness:.2
    });

}

/* =====================================================
   AR
===================================================== */

function createARModel(){

    let body=new THREE.Mesh(
        new THREE.BoxGeometry(.25,.25,1.1),
        gunMaterial(0x222222)
    );

    body.position.z=-.35;
    gunModel.add(body);

        new THREE.BoxGeometry(.09,.09,.65),
        gunMaterial(0x111111)
    );

        new THREE.BoxGeometry(.16,.35,.18),

/* GUN ANIMATION */

function updateGun(delta){

    if(!gunModel)return;

    gunRecoil=THREE.MathUtils.lerp(
        gunRecoil,
        0,
        delta*12
    );

    let targetX=isADS?0:.45;
    let targetY=isADS?-.28:-.38;
    let targetZ=isADS?-.9:-.75;

    if(currentWeapon==="PISTOL"){
        targetX=isADS?0:.38;
    }

    if(currentWeapon==="SNIPER"){
        targetX=isADS?0:.42;
    }

    gunModel.position.x=
        THREE.MathUtils.lerp(
            gunModel.position.x,
            targetX,
            delta*10
        );

    gunModel.position.y=
        THREE.MathUtils.lerp(
            gunModel.position.y,
            targetY,
            delta*10
        );

    gunModel.position.z=
        THREE.MathUtils.lerp(
            gunModel.position.z,
            targetZ+gunRecoil,
            delta*15
        );

    if(
        Math.abs(joyX)>.1||
        Math.abs(joyY)>.1
    ){

        gunBobTime+=delta*8;

        gunModel.position.y+=
            Math.sin(gunBobTime)*.015;

        gunModel.position.x+=
            Math.cos(gunBobTime*.5)*.01;

    }

}

    gunRecoil=.12;

}

function createAirdrop(){

    if(gameOver)return;

    let position=
        randomAirdropPosition();

    let group=
        new THREE.Group();

    /* CRATE */

    let crate=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3,
                2,
                3
            ),
            new THREE.MeshStandardMaterial({
                color:0x8B4513,
                roughness:.8
            })
        );

    group.add(crate);

    /* STRAPS */

    let strapMaterial=
        new THREE.MeshBasicMaterial({
            color:0xffff00
        });

    let strap1=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                .25,
                2.1,
                3.1
            ),
            strapMaterial
        );

    let strap2=
        new THREE.Mesh(
            new THREE.BoxGeometry(
                3.1,
                2.1,
                .25
            ),
            strapMaterial
        );

    group.add(strap1);
    group.add(strap2);

    /* PARACHUTE */

    let parachute=
        new THREE.Mesh(
            new THREE.SphereGeometry(
                5,
                12,
                6,
                0,
                Math.PI*2,
                0,
                Math.PI/2
            ),
            new THREE.MeshStandardMaterial({
                color:0xffffff,
                side:THREE.DoubleSide
            })
        );

    parachute.position.y=10;

    group.add(parachute);

    /* ROPES */

    let ropeMaterial=
        new THREE.LineBasicMaterial({
            color:0xffffff
        });

    for(
        let i=0;
        i<4;
        i++
    ){

        let angle=
            i*Math.PI/2;

        let points=[
            new THREE.Vector3(
                Math.cos(angle)*4,
                9,
                Math.sin(angle)*4
            ),
            new THREE.Vector3(
                Math.cos(angle)*1.3,
                1,
                Math.sin(angle)*1.3
            )
        ];

        let geometry=
            new THREE.BufferGeometry()
                .setFromPoints(points);

        let line=
            new THREE.Line(
                geometry,
                ropeMaterial
            );

        group.add(line);

    }

    group.position.set(
        position.x,
        airdropDropHeight,
        position.z
    );

    group.userData={
        landed:false,
        collected:false,
        id:++airdropId,
        velocity:airdropFallSpeed
    };

    scene.add(group);

    airdrops.push(group);

    showAirdropMessage(
        "✈ AIRDROP INCOMING!"
    );

}

function updateAirdrops(delta){

    if(gameOver)return;

    nextAirdropTimer-=delta;

    if(
        nextAirdropTimer<=0
    ){

        createAirdrop();

        nextAirdropTimer=
            30+
            Math.random()*30;

    }

    for(
        let i=airdrops.length-1;
        i>=0;
        i--
    ){

        let drop=
            airdrops[i];

        if(
            !drop||
            drop.userData.collected
        ){

            continue;

        }

        if(
            !drop.userData.landed
        ){

            drop.position.y-=
                drop.userData.velocity*
                delta;

            if(
                drop.position.y<=2
            ){

                drop.position.y=2;

                drop.userData.landed=true;

                /* HIDE PARACHUTE */

                if(drop.children.length>0){

                    for(
                        let j=0;
                        j<drop.children.length;
                        j++
                    ){

                        if(
                            j>=3
                        ){

                            drop.children[j]
                                .visible=false;

                        }

                    }

                }

                showAirdropMessage(
                    "📦 AIRDROP LANDED!"
                );

            }

        }

        let distance=
            Math.hypot(
                player.position.x-
                    drop.position.x,
                player.position.z-
                    drop.position.z
            );

        if(
            distance<
            airdropCollectDistance
        ){

            if(
                drop.userData.landed
            ){

                collectAirdrop(
                    drop
                );

            }

        }

    }

    updateAirdropHUD();

}

function collectAirdrop(drop){

    if(
        drop.userData.collected
    )return;

    drop.userData.collected=true;

    /* HEALTH */

    let healthAmount=
        25+
        Math.floor(
            Math.random()*26
        );

    health=
        GameCore.airdropHealth(
            health,
            healthAmount
        );

    /* AMMO */

    GameCore.restockReserves(
        weapons
    );

    /* RANDOM UPGRADES */

    let upgradeCount=
        1+
        Math.floor(
            Math.random()*4
        );

    let upgradesReceived=
        GameCore.applyUpgrades(
            weapons[currentWeapon],
            upgradeCount
        );

    score+=GameCore.AIRDROP_SCORE;

    showScorePopup(
        "+500 AIRDROP"
    );

    let text=
        "AIRDROP COLLECTED!<br>"+
        "HEALTH +"+
        healthAmount+
        "<br>"+
        "AMMO RESTOCKED";

    if(
        upgradesReceived.length>0
    ){

        text+=
            "<br>UPGRADES:"+
            "<br>"+
            upgradesReceived.join(
                "<br>"
            );

    }

    showAirdropMessage(
        "AIRDROP COLLECTED!"
    );

    showAirdropInfo(
        text
    );

    setTimeout(
        hideAirdropInfo,
        4500
    );

    updateHUD();

    if(drop.parent){

        scene.remove(drop);

    }

    let index=
        airdrops.indexOf(
            drop
        );

    if(index!==-1){

        airdrops.splice(
            index,
            1
        );

    }

}

function updateAirdropHUD(){

    document.getElementById(
        "airdropCount"
    ).textContent=
        airdrops.filter(
            d=>
                d &&
                !d.userData.collected
        ).length;

function startWave(){

    if(gameOver)return;

    if(waveStarting)return;

    waveStarting=true;

    currentWave++;

    waveInProgress=true;

    waveEnemiesRemaining=
        GameCore.waveEnemyCount(
            currentWave
        );

    waveSpawnTimer=0;

    updateWaveHUD();

    setTimeout(
        function(){

            waveStarting=false;

        },
        500
    );

}

function updateWaveSystem(delta){

    if(gameOver)return;

    if(!waveInProgress)return;

    let activeEnemies=
        enemies.filter(
            enemy=>
                enemy.alive
        ).length;

    if(
        waveEnemiesRemaining>0&&
        activeEnemies<
            MAX_ACTIVE_ENEMIES
    ){

        waveSpawnTimer-=delta;

        if(
            waveSpawnTimer<=0
        ){

            spawnWaveEnemy();

            waveEnemiesRemaining--;

            waveSpawnTimer=.7;

        }

    }

    let aliveEnemies=
        enemies.filter(
            enemy=>
                enemy.alive
        ).length;

    if(
        waveEnemiesRemaining<=0&&
        aliveEnemies===0
    ){

        waveInProgress=false;

        let waveBonus=
            GameCore.waveBonus(
                currentWave
            );

        score+=waveBonus;

        showScorePopup(
            "+"+
            waveBonus+
            " WAVE BONUS"
        );

        updateHUD();

        setTimeout(
            function(){

                if(!gameOver)
                    startWave();

            },
            3000
        );

    }

}

function spawnWaveEnemy(){

    if(gameOver)return;

    let attempts=0;

    let x=0;
    let z=0;

    while(
        attempts<30
    ){

        let spawn=
            spawnPoints[
                Math.floor(
                    Math.random()*
                    spawnPoints.length
                )
            ];

        x=spawn[0];
        z=spawn[1];

        let distance=
            Math.hypot(
                x-
                    player.position.x,
                z-
                    player.position.z
            );

        if(
            distance>=40&&
            !circleIntersectsWall(
                x,
                z,
                ENEMY_RADIUS
            )
        ){

            break;

        }

        attempts++;

    }

    createEnemy(
        x,
        z
    );

}

/* =====================================================
   CONTROLS
===================================================== */

function setupControls(){

    let joystick=
        document.getElementById(
            "joystick"
        );

    let stick=
        document.getElementById(
            "stick"
        );

    joystick.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            if(
                joystickTouch!==null
            )
                return;

            joystickTouch=
                e.changedTouches[0]
                    .identifier;

        },
        {
            passive:false
        }
    );

    joystick.addEventListener(
        "touchmove",
        function(e){

            e.preventDefault();

            if(
                joystickTouch===null
            )
                return;

            let touch=
                [...e.touches].find(
                    t=>
                        t.identifier===
                        joystickTouch
                );

            if(!touch)return;

            let rect=
                joystick.getBoundingClientRect();

            let x=
                touch.clientX-
                (
                    rect.left+
                    rect.width/2
                );

            let y=
                touch.clientY-
                (
                    rect.top+
                    rect.height/2
                );

            let max=40;

            let distance=
                Math.hypot(
                    x,
                    y
                );

            if(
                distance>max
            ){

                x=
                    x/
                    distance*
                    max;

                y=
                    y/
                    distance*
                    max;

            }

            joyX=x/max;
            joyY=y/max;

            stick.style.transform=
                "translate("+
                x+
                "px,"+
                y+
                "px)";

        },
        {
            passive:false
        }
    );

    function resetJoystick(){

        joystickTouch=null;

        joyX=0;
        joyY=0;

        stick.style.transform=
            "translate(0px,0px)";

    }

    joystick.addEventListener(
        "touchend",
        resetJoystick
    );

    joystick.addEventListener(
        "touchcancel",
        resetJoystick
    );

    renderer.domElement.addEventListener(
        "touchstart",
        function(e){

            for(
                let touch of
                e.changedTouches
            ){

                if(
                    touch.clientX>
                    window.innerWidth/2
                ){

                    if(
                        aimTouch===null
                    ){

                        aimTouch=
                            touch.identifier;

                        lastX=
                            touch.clientX;

                        lastY=
                            touch.clientY;

                    }

                }

            }

        },
        {
            passive:true
        }
    );

    renderer.domElement.addEventListener(
        "touchmove",
        function(e){

            for(
                let touch of
                e.changedTouches
            ){

                if(
                    touch.identifier===
                    aimTouch
                ){

                    let dx=
                        touch.clientX-
                        lastX;

                    let dy=
                        touch.clientY-
                        lastY;

                    rotationY-=
                        dx*.004;

                    rotationX-=
                        dy*.004;

                    rotationX=
                        Math.max(
                            -1.3,
                            Math.min(
                                1.3,
                                rotationX
                            )
                        );

                    player.rotation.y=
                        rotationY;

                    camera.rotation.x=
                        rotationX;

                    lastX=
                        touch.clientX;

                    lastY=
                        touch.clientY;

                }

            }

        },
        {
            passive:true
        }
    );

    function resetAim(e){

        for(
            let touch of
            e.changedTouches
        ){

            if(
                touch.identifier===
                aimTouch
            ){

                aimTouch=null;

            }

        }

    }

    renderer.domElement.addEventListener(
        "touchend",
        resetAim
    );

    renderer.domElement.addEventListener(
        "touchcancel",
        resetAim
    );

    /* FIRE */

    let fireButton=
        document.getElementById(
            "fire"
        );

    fireButton.addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            isFiring=true;

            shoot();

        },
        {
            passive:false
        }
    );

    fireButton.addEventListener(
        "touchend",
        function(e){

            e.preventDefault();

            isFiring=false;

        },
        {
            passive:false
        }
    );

    fireButton.addEventListener(
        "touchcancel",
        function(){

            isFiring=false;

        }
    );

    /* ADS */

    document.getElementById(
        "ads"
    ).addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            toggleADS();

        },
        {
            passive:false
        }
    );

    /* RELOAD */

    document.getElementById(
        "reload"
    ).addEventListener(
        "touchstart",
        function(e){

            e.preventDefault();

            reload();

        },
        {
            passive:false
        }
    );

    /* WEAPONS */

    document
        .querySelectorAll(
            ".weaponButton"
        )
        .forEach(
            button=>{

                button.addEventListener(
                    "touchstart",
                    function(e){

                        e.preventDefault();

                        switchWeapon(
                            button.dataset.weapon
                        );

                    },
                    {
                        passive:false
                    }
                );

            }
        );

    /* RESTART */

    document.getElementById(
        "restart"
    ).addEventListener(
        "click",
        function(){

            location.reload();

        }
    );

}

/* =====================================================
   PLAYER MOVEMENT
===================================================== */

function movePlayer(delta){

    if(gameOver)return;

    let speed=8;

    let forward=
        new THREE.Vector3(
            0,
            0,
            -1
        );

    let right=
        new THREE.Vector3(
            1,
            0,
            0
        );

    forward.applyQuaternion(
        player.quaternion
    );

    right.applyQuaternion(
        player.quaternion
    );

    forward.y=0;
    right.y=0;

    forward.normalize();
    right.normalize();

    let movement=
        new THREE.Vector3();

    movement.add(
        forward.multiplyScalar(
            -joyY
        )
    );

    movement.add(
        right.multiplyScalar(
            joyX
        )
    );

    if(
        movement.length()>0
    ){

        movement.normalize();

        movement.multiplyScalar(
            speed*delta
        );

        moveWithCollision(
            player,
            movement,
            PLAYER_RADIUS
        );

    }

    player.position.x=
        Math.max(
            -120,
            Math.min(
                120,
                player.position.x
            )
        );

    player.position.z=
        Math.max(
            -120,
            Math.min(
                120,
                player.position.z
            )
        );

}

/* =====================================================
   SHOOTING
===================================================== */

function shoot(){

    if(gameOver)return;

    const weapon=
        weapons[currentWeapon];

    const now=
        performance.now();

    /*
       SNIPER MUST BE SCOPED TO FIRE
       AND ALWAYS FIRES ONE SHOT.
    */

    if(
        !GameCore.canFire(
            weapon,
            currentWeapon,
            now,
            lastPlayerShot,
            isADS
        )
    ){

        if(
            weapon.ammo<=0&&
            now-lastPlayerShot>=
                weapon.fireRate
        ){

            reload();

        }

        return;

    }

    lastPlayerShot=now;

    weapon.ammo--;

    fireGunAnimation();

    updateWeaponHUD();

    const direction=
        new THREE.Vector3();

    camera.getWorldDirection(
        direction
    );

    direction.normalize();

    /*
       SNIPER HAS ZERO SPREAD.
       OTHER WEAPONS USE SPREAD.
    */

    if(
        weapon.spread>0
    ){

        direction.x+=
            (
                Math.random()-.5
            )*
            weapon.spread;

        direction.y+=
            (
                Math.random()-.5
            )*
            weapon.spread;

        direction.z+=
            (
                Math.random()-.5
            )*
            weapon.spread;

        direction.normalize();

    }

    const start=
        new THREE.Vector3();

    camera.getWorldPosition(
        start
    );

    createProjectile(
        start,
        direction,
        true,
        weapon.damage,
        weapon.projectileSpeed,
        weapon.projectileLife
    );

}

/* =====================================================
   PROJECTILE
===================================================== */

function createProjectile(
    start,
    direction,
    friendly,
    damage,
    speed,
    life
){

    const geometry=
        new THREE.SphereGeometry(
            friendly?.1:.15,
            6,
            6
        );

    const material=
        new THREE.MeshBasicMaterial({
            color:
                friendly?
                0xffff00:
                0xff0000
        });

    const bullet=
        new THREE.Mesh(
            geometry,
            material
        );

    bullet.position.copy(
        start
    );

    bullet.userData={

        direction:
            direction.clone()
                .normalize(),

        speed:speed,

        damage:damage,

        friendly:friendly,

        life:life,

        age:0

    };

    scene.add(
        bullet
    );

    projectiles.push(
        bullet
    );

}

/* =====================================================
   UPDATE PROJECTILES
===================================================== */

function updateProjectiles(delta){

    if(
        !projectiles||
        projectiles.length===0
    ){

        return;

    }

    for(
        let i=
            projectiles.length-1;
        i>=0;
        i--
    ){

        const projectile=
            projectiles[i];

        if(!projectile){

            projectiles.splice(
                i,
                1
            );

            continue;

        }

        const data=
            projectile.userData;

        if(!data){

            removeProjectile(i);

            continue;

        }

        const oldPosition=
            projectile.position.clone();

        const movement=
            data.direction
                .clone()
                .multiplyScalar(
                    data.speed*
                    delta
                );

        projectile.position.add(
            movement
        );

        data.age+=delta;

        if(
            data.age>=data.life
        ){

            removeProjectile(i);

            continue;

        }

        const travel=
            projectile.position
                .clone()
                .sub(
                    oldPosition
                );

        const distance=
            travel.length();

        if(distance<=0)continue;

        travel.normalize();

        const ray=
            new THREE.Raycaster(
                oldPosition,
                travel,
                0,
                distance
            );

        const wallHits=
            ray.intersectObjects(
                walls,
                false
            );

        if(
            wallHits.length>0
        ){

            createHitEffect(
                wallHits[0].point
            );

            removeProjectile(i);

            continue;

        }

        if(data.friendly){

            const hit=
                checkBulletEnemyHit(
                    ray,
                    data.damage
                );

            if(hit){

                removeProjectile(i);

                continue;

            }

        }

        else{

            const hit=
                checkBulletPlayerHit(
                    ray
                );

            if(hit){

                removeProjectile(i);

                continue;

            }

        }

    }

}

/* =====================================================
   BULLET ENEMY HIT
===================================================== */

function checkBulletEnemyHit(
    ray,
    damage
){

    if(!enemies)return false;

    for(
        let i=0;
        i<enemies.length;
        i++
    ){

        const enemy=
            enemies[i];

        if(
            !enemy||
            !enemy.alive
        )continue;

        const meshes=[];

        enemy.traverse(
            function(object){

                if(object.isMesh){

                    meshes.push(
                        object
                    );

                }

            }
        );

        const hits=
            ray.intersectObjects(
                meshes,
                false
            );

        if(
            hits.length===0
        )continue;

        const hit=
            hits[0];

        showHitMarker();

        enemy.health-=
            damage;

        createHitEffect(
            hit.point
        );

        if(
            enemy.health<=0
        ){

            killEnemy(
                enemy
            );

        }

        else{

            score+=10;

            showScorePopup(
                "+10"
            );

            updateHUD();

        }

        return true;

    }

    return false;

}

/* =====================================================
   PLAYER HIT
===================================================== */

function checkBulletPlayerHit(
    ray
){

    if(!player)return false;

    const playerPosition=
        player.position.clone();

    const playerRadius=
        1.2;

    const toPlayer=
        playerPosition
            .clone()
            .sub(
                ray.ray.origin
            );

    const distanceAlongRay=
        toPlayer.dot(
            ray.ray.direction
        );

    if(
        distanceAlongRay<0||
        distanceAlongRay>ray.far
    ){

        return false;

    }

    const closestPoint=
        ray.ray.origin
            .clone()
            .add(
                ray.ray.direction
                    .clone()
                    .multiplyScalar(
                        distanceAlongRay
                    )
            );

    const distance=
        closestPoint.distanceTo(
            playerPosition
        );

    if(
        distance<=playerRadius
    ){

        takeDamage(5);

        return true;

    }

    return false;

}

/* =====================================================
   HIT EFFECT
===================================================== */

function createHitEffect(
    position
){

    if(!scene)return;

    const geometry=
        new THREE.SphereGeometry(
            .15,
            6,
            6
        );

    const material=
        new THREE.MeshBasicMaterial({
            color:0xffff00,
            transparent:true,
            opacity:1
        });

    const effect=
        new THREE.Mesh(
            geometry,
            material
        );

    effect.position.copy(
        position
    );

    scene.add(effect);

    const startTime=
        performance.now();

    function animateHitEffect(){

        if(!effect.parent)return;

        const elapsed=
            performance.now()-
            startTime;

        const progress=
            elapsed/150;

        if(
            progress>=1
        ){

            scene.remove(
                effect
            );

            geometry.dispose();

            material.dispose();

            return;

        }

        effect.scale.setScalar(
            1+
            progress*3
        );

        material.opacity=
            1-progress;

        requestAnimationFrame(
            animateHitEffect
        );

    }

    animateHitEffect();

}

/* =====================================================
   REMOVE PROJECTILE
===================================================== */

function removeProjectile(
    index
){

    if(
        !projectiles||
        index<0||
        index>=projectiles.length
    ){

        return;

    }

    const projectile=
        projectiles[index];

    if(projectile){

        if(
            projectile.parent
        ){

            projectile.parent.remove(
                projectile
            );

        }

        if(
            projectile.geometry
        ){

            projectile.geometry.dispose();

        }

        if(
            projectile.material
        ){

            projectile.material.dispose();

        }

    }

    projectiles.splice(
        index,
        1
    );

}

/* =====================================================
   RELOAD
===================================================== */

function reload(){

    const amount=
        GameCore.reloadWeapon(
            weapons[currentWeapon]
        );

    if(amount>0){

        updateWeaponHUD();

    }

}

/* =====================================================
   ENEMY AI
===================================================== */

function updateEnemies(
    delta
){

    if(gameOver)return;

    for(
        let enemy of enemies
    ){

        if(!enemy.alive)continue;

        let direction=
            new THREE.Vector3();

        direction.subVectors(
            player.position,
            enemy.position
        );

        direction.y=0;

        let distance=
            direction.length();

        if(
            distance>
            enemy.detectionRange
        ){

            continue;

        }

        enemy.lookAt(
            player.position.x,
            enemy.position.y,
            player.position.z
        );

        if(
            distance>18
        ){

            direction.normalize();

            let movement=
                direction.clone()
                    .multiplyScalar(
                        enemy.moveSpeed*
                        delta
                    );

            let oldPosition=
                enemy.position.clone();

            moveWithCollision(
                enemy,
                movement,
                ENEMY_RADIUS
            );

            if(
                enemy.position.distanceTo(
                    oldPosition
                )<.001
            ){

                let slideX=
                    new THREE.Vector3(
                        movement.x,
                        0,
                        0
                    );

                let slideZ=
                    new THREE.Vector3(
                        0,
                        0,
                        movement.z
                    );

                moveWithCollision(
                    enemy,
                    slideX,
                    ENEMY_RADIUS
                );

                moveWithCollision(
                    enemy,
                    slideZ,
                    ENEMY_RADIUS
                );

            }

            enemy.walkTime+=
                delta*8;

            enemy.leftLeg.rotation.x=
                Math.sin(
                    enemy.walkTime
                )*.5;

            enemy.rightLeg.rotation.x=
                Math.sin(
                    enemy.walkTime+
                    Math.PI
                )*.5;

        }

        enemy.shootTimer-=
            delta;

        if(
            distance<
            enemy.attackRange&&
            enemy.shootTimer<=0
        ){

            enemy.shootTimer=
                1.5+
                Math.random()*
                1.5;

            enemyShoot(
                enemy
            );

        }

    }

}

/* =====================================================
   ENEMY SHOOT
===================================================== */

function enemyShoot(
    enemy
){

    if(gameOver)return;

    let start=
        enemy.position.clone();

    start.y+=2;

    let target=
        player.position.clone();

    target.y-=.3;

    let direction=
        new THREE.Vector3();

    direction.subVectors(
        target,
        start
    );

    direction.normalize();

    direction.x+=
        (
            Math.random()-.5
        )*.035;

    direction.y+=
        (
            Math.random()-.5
        )*.035;

    direction.z+=
        (
            Math.random()-.5
        )*.035;

    direction.normalize();

    let raycaster=
        new THREE.Raycaster(
            start,
            direction
        );

    raycaster.far=150;

    let wallHits=
        raycaster.intersectObjects(
            walls,
            false
        );

    let playerDistance=
        start.distanceTo(
            target
        );

    if(
        wallHits.length>0&&
        wallHits[0].distance<
        playerDistance
    ){

        return;

    }

    createProjectile(
        start,
        direction,
        false,
        5,
        35,
        5
    );

}

/* =====================================================
   DAMAGE
===================================================== */

function takeDamage(
    damage
){

    if(gameOver)return;

    health=
        GameCore.applyDamage(
            health,
            damage
        );

    updateHUD();

    let flash=
        document.getElementById(
            "damageFlash"
        );

    flash.style.opacity=1;

    setTimeout(
        function(){

            flash.style.opacity=0;

        },
        120
    );

    if(
        health<=0
    ){

        loseGame();

    }

}

/* =====================================================
   HUD
===================================================== */

function updateHUD(){

    document.getElementById(
        "scoreDisplay"
    ).textContent=
        score;

    document.getElementById(
        "kills"
    ).textContent=
        kills;

    document.getElementById(
        "enemyCount"
    ).textContent=

        enemies.filter(
            e=>
                e.alive
        ).length;

    document.getElementById(
        "health"
    ).style.width=
        health+
        "%";

    updateWeaponHUD();

    updateAirdropHUD();

}

/* WAVE */

function updateWaveHUD(){

    document.getElementById(
        "wave"
    ).textContent=
        currentWave;

}

/* =====================================================
   HIT MARKER
===================================================== */

let hitMarkerTimer=null;

function showHitMarker(){

    let marker=
        document.getElementById(
            "hitMarker"
        );

    marker.style.opacity=1;

    if(hitMarkerTimer){

        clearTimeout(
            hitMarkerTimer
        );

    }

    hitMarkerTimer=
        setTimeout(
            function(){

                marker.style.opacity=0;

            },
            100
        );

}

/* =====================================================
   GAME OVER
===================================================== */

function loseGame(){

    if(gameOver)return;

    gameOver=true;

    isFiring=false;

    document.getElementById(
        "messageText"
    ).textContent=
        "GAME OVER";

    document.getElementById(
        "finalScore"
    ).textContent=
        "FINAL SCORE: "+
        score;

    document.getElementById(
        "message"
    ).style.display=
        "block";

}

/* =====================================================
   RESIZE
===================================================== */

function resize(){

    camera.aspect=
        window.innerWidth/
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}

/* =====================================================
   GAME LOOP
===================================================== */

let lastTime=
    performance.now();

function animate(){

    requestAnimationFrame(
        animate
    );

    let now=
        performance.now();

    let delta=
        (
            now-
            lastTime
        )/
        1000;

    lastTime=now;

    delta=
        Math.min(
            delta,
            .1
        );

    /*
       AUTOMATIC WEAPONS
       SNIPER IS NOT AUTOMATIC.
       It fires exactly once per press.
    */

    if(
        isFiring&&
        weapons[currentWeapon]
            .automatic
    ){

        shoot();

    }

    movePlayer(
        delta
    );

    updateEnemies(
        delta
    );

    updateProjectiles(
        delta
    );

    updateWaveSystem(
        delta
    );

    updateAirdrops(
        delta
    );

    updateGun(
        delta
    );

    updateHUD();

    renderer.render(
        scene,
        camera
    );

}

/* =====================================================
   START GAME
===================================================== */

startGame();

</script>
